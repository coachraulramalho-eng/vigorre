<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vigorre One™ - Área do Participante • People Analytics Enterprise">
  <meta name="robots" content="noindex, nofollow">
  <title>Minha Área | Vigorre One™ • People Analytics Enterprise</title>
  
  <!-- Fonts Premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Preconnect para performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- ✅ GLOBAL STYLES PREMIUM -->
  <link rel="stylesheet" href="assets/css/globals.css">
  
  <!-- ✅ SUPABASE SDK - CARREGAR PRIMEIRO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- ✅ SUA CONFIGURAÇÃO SUPABASE -->
  <script src="supabase-config.js"></script>
  
  <style>
    /* ============================================
       ESTILOS ESPECÍFICOS DO DASHBOARD PARTICIPANTE
       ============================================ */
    body {
      background: linear-gradient(135deg, var(--slate-50) 0%, #ffffff 100%);
      color: var(--slate-800);
      min-height: 100vh;
    }

    /* Header Premium */
    .header {
      background: var(--brand-navy);
      color: white;
      padding: 1rem 0;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      color: white;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.4);
    }

    .brand-text h1 {
      font-size: 1.125rem;
      font-weight: 700;
      margin: 0;
    }

    .brand-text span {
      font-size: 0.75rem;
      opacity: 0.85;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 0.625rem 1.25rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-1px);
    }

    /* Container Principal */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Card de Perfil - Glassmorphism */
    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--slate-200);
      transition: box-shadow var(--transition), transform var(--transition);
    }

    .profile-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--slate-100);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-purple));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 8px 25px rgba(29, 78, 216, 0.3);
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--slate-800);
      margin-bottom: 0.5rem;
    }

    .profile-details {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .profile-detail {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--slate-600);
      font-size: 0.875rem;
    }

    .profile-detail svg {
      width: 18px;
      height: 18px;
      opacity: 0.6;
    }

    .tags {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.875rem;
      background: var(--slate-50);
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--slate-700);
      border: 1px solid var(--slate-200);
    }

    .tag svg {
      width: 16px;
      height: 16px;
    }

    /* Seção de Testes */
    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--slate-800);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .section-title svg {
      width: 24px;
      height: 24px;
      color: var(--brand-blue);
    }

    .tests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
    }

    .test-card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      border: 1px solid var(--slate-200);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .test-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand-blue), var(--brand-purple));
      opacity: 0;
      transition: opacity var(--transition);
    }

    .test-card:hover {
      border-color: var(--brand-blue);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .test-card:hover::before {
      opacity: 1;
    }

    .test-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-purple));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      font-size: 2rem;
      color: white;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.3);
    }

    .test-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--slate-800);
      margin-bottom: 0.75rem;
    }

    .test-description {
      color: var(--slate-600);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--slate-100);
      color: var(--slate-700);
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      border: 1px solid var(--slate-200);
    }

    .status-badge.pending {
      background: #fffbeb;
      color: #92400e;
      border-color: #fde68a;
    }

    .status-badge.completed {
      background: #dcfce7;
      color: #166534;
      border-color: #bbf7d0;
    }

    .status-badge svg {
      width: 16px;
      height: 16px;
    }

    .btn-start {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-dark));
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
      position: relative;
      overflow: hidden;
    }

    .btn-start::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn-start:hover::before {
      left: 100%;
    }

    .btn-start:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(29, 78, 216, 0.45);
    }

    .btn-start svg {
      width: 20px;
      height: 20px;
    }

    .btn-start:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      background: var(--slate-300);
    }

    /* Loading State */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      color: var(--slate-600);
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--slate-200);
      border-top-color: var(--brand-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--slate-600);
      background: var(--slate-50);
      border-radius: 16px;
      border: 2px dashed var(--slate-200);
      grid-column: 1 / -1;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* ============================================
       TOOLTIPS PREMIUM - GLASSMORPHISM
       ============================================ */
    [data-tooltip] {
      position: relative;
    }
    
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 0.625rem 1rem;
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--slate-800);
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--glass-border);
      z-index: var(--z-tooltip, 1070);
      pointer-events: none;
    }
    
    [data-tooltip]:hover::before {
      content: '';
      position: absolute;
      bottom: 115%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--glass-bg);
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition);
      z-index: var(--z-tooltip, 1070);
      pointer-events: none;
    }
    
    [data-tooltip]:hover::after,
    [data-tooltip]:hover::before {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================
       RESPONSIVO
       ============================================ */
    @media (max-width: 768px) {
      .header-content {
        padding: 0 1rem;
      }

      .container {
        padding: 1rem;
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
      }

      .profile-details {
        justify-content: center;
      }

      .tags {
        justify-content: center;
      }

      .tests-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ============================================
       ANIMAÇÕES DE ENTRADA
       ============================================ */
    @media (prefers-reduced-motion: no-preference) {
      .test-card {
        animation: fadeIn 0.5s ease-out both;
      }
      
      .test-card:nth-child(1) { animation-delay: 0.1s; }
      .test-card:nth-child(2) { animation-delay: 0.2s; }
      .test-card:nth-child(3) { animation-delay: 0.3s; }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       ACESSIBILIDADE
       ============================================ */
    .btn-start:focus-visible,
    .logout-btn:focus-visible {
      outline: 2px solid var(--brand-blue);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo-section">
        <div class="logo">V</div>
        <div class="brand-text">
          <h1>Vigorre One™</h1>
          <span>Minha Área</span>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()" data-tooltip="Sair da sua conta">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Sair
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <div class="container">
    
    <!-- Card de Perfil -->
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">FC</div>
        <div class="profile-info">
          <h2 id="participantName">Carregando...</h2>
          <div class="profile-details">
            <div class="profile-detail">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <span id="participantEmail">...</span>
            </div>
            <div class="profile-detail">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span id="participantPhone">...</span>
            </div>
          </div>
          <div class="tags">
            <span class="tag">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
              </svg>
              <span id="participantCompany">Independente</span>
            </span>
            <span class="tag">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <span id="participantJob">Não vinculada</span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Seção de Testes -->
    <h2 class="section-title">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
      </svg>
      Meus Testes Disponíveis
    </h2>

    <div class="tests-grid" id="testsGrid">
      <!-- Loading state inicial -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <span>Carregando seus testes...</span>
      </div>
    </div>

  </div>

  <script>
    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    let currentUser = null;
    let participantData = null;

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🔹 Dashboard Participante - Iniciando...');
      
      // Verificar autenticação
      checkAuth();
      
      // Carregar dados do participante
      loadParticipantData();
    });

    // ============================================
    // VERIFICAR AUTENTICAÇÃO
    // ============================================
    function checkAuth() {
      const stored = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
      const sessionActive = sessionStorage.getItem('vigorre_session_active') === 'true';
      
      if (!stored.role || stored.role !== 'participant' || !sessionActive) {
        console.log('⚠️ Usuário não autenticado - redirecionando para login');
        window.location.href = 'login.html';
        return;
      }
      
      currentUser = stored;
      console.log('✅ Usuário autenticado:', currentUser.name);
    }

    // ============================================
    // CARREGAR DADOS DO PARTICIPANTE COM SUPABASE
    // ============================================
    async function loadParticipantData() {
      try {
        console.log('🔍 Buscando dados do participante...');
        
        // PRIMEIRO: Tentar Supabase
        if (window.VigorreDB && VigorreDB.supabase && currentUser?.id) {
          try {
            const { data, error } = await VigorreDB.supabase
              .from('participants')
              .select('*')
              .eq('id', currentUser.id)
              .maybeSingle();
            
            if (data && !error) {
              participantData = data;
              console.log('✅ Dados carregados do Supabase');
              updateUI(participantData);
              loadTests(participantData);
              return;
            }
          } catch (e) {
            console.warn('⚠️ Erro ao buscar do Supabase, usando localStorage:', e);
          }
        }
        
        // SEGUNDO: Fallback para localStorage
        const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
        participantData = participants.find(p => p.id === currentUser?.id);
        
        if (participantData) {
          console.log('✅ Dados carregados do localStorage');
          updateUI(participantData);
          loadTests(participantData);
          return;
        }
        
        console.log('❌ Participante não encontrado');
        showToast('Erro ao carregar seus dados', 'error');
        
      } catch (e) {
        console.error('❌ Erro ao carregar participante:', e);
        showToast('Erro ao conectar com o servidor', 'error');
      }
    }

    // ============================================
    // ATUALIZAR INTERFACE COM DADOS
    // ============================================
    function updateUI(data) {
      if (!data) return;
      
      // Nome
      document.getElementById('participantName').textContent = data.name || 'Participante';
      
      // Avatar com iniciais
      const avatar = document.getElementById('profileAvatar');
      if (avatar && data.name) {
        const initials = data.name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
        avatar.textContent = initials;
      }
      
      // Email
      document.getElementById('participantEmail').textContent = data.email || '-';
      
      // Telefone
      document.getElementById('participantPhone').textContent = data.phone || '-';
      
      // Empresa
      const companyEl = document.getElementById('participantCompany');
      if (companyEl) {
        if (data.companyName) {
          companyEl.textContent = data.companyName;
        } else if (data.companyId) {
          // Buscar nome da empresa no localStorage
          const companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
          const company = companies.find(c => c.id === data.companyId);
          companyEl.textContent = company?.name || 'Independente';
        } else {
          companyEl.textContent = 'Independente';
        }
      }
      
      // Cargo/Vaga
      const jobEl = document.getElementById('participantJob');
      if (jobEl) {
        if (data.jobs && Array.isArray(data.jobs) && data.jobs.length > 0) {
          jobEl.textContent = data.jobs[0].name || data.jobs[0].title || 'Vaga vinculada';
        } else {
          jobEl.textContent = 'Não vinculada';
        }
      }
    }

    // ============================================
    // CARREGAR LISTA DE TESTES
    // ============================================
    function loadTests(participant) {
      const grid = document.getElementById('testsGrid');
      if (!grid) return;
      
      // Testes disponíveis no sistema
      const availableTests = [
        { 
          id: 'DISC', 
          name: 'Teste DISC', 
          description: 'Análise de perfil comportamental baseada na metodologia DISC de William Marston', 
          icon: '📊',
          color: 'linear-gradient(135deg, var(--brand-blue), var(--brand-purple))'
        },
        { 
          id: 'IE', 
          name: 'Inteligência Emocional', 
          description: 'Avaliação de competências emocionais e relacionais para alta performance', 
          icon: '🧠',
          color: 'linear-gradient(135deg, var(--brand-cyan), var(--brand-emerald))'
        },
        { 
          id: 'Valores', 
          name: 'Valores Pessoais', 
          description: 'Mapeamento de valores e motivadores profissionais para fit cultural', 
          icon: '💎',
          color: 'linear-gradient(135deg, var(--brand-amber), var(--brand-rose))'
        }
      ];
      
      // Testes atribuídos ao participante
      const assignedTests = participant?.tests || participant?.assignedTests || [];
      
      // Testes já completados
      const completedTests = participant?.completedTests || [];
      
      console.log('📊 Status dos testes:', { assigned: assignedTests, completed: completedTests });
      
      // Se não houver testes atribuídos
      if (!assignedTests || assignedTests.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3 style="color: var(--slate-700); margin-bottom: 0.5rem;">Nenhum teste liberado ainda</h3>
            <p>Entre em contato com o administrador da Vigorre One™ para liberar seus testes comportamentais.</p>
          </div>
        `;
        return;
      }
      
      // Renderizar cards dos testes atribuídos
      grid.innerHTML = availableTests
        .filter(test => assignedTests.includes(test.id))
        .map((test, index) => {
          const isCompleted = completedTests.includes(test.id);
          const statusText = isCompleted ? '✅ Teste Concluído' : '⏳ Disponível para Iniciar';
          const statusClass = isCompleted ? 'completed' : 'pending';
          
          return `
            <div class="test-card" style="animation-delay: ${0.1 + index * 0.1}s">
              <div class="test-icon" style="background: ${test.color}">${test.icon}</div>
              <h3>${test.name}</h3>
              <p class="test-description">${test.description}</p>
              <div class="status-badge ${statusClass}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                ${statusText}
              </div>
              <button class="btn-start" 
                      onclick="${isCompleted ? `viewReport('${test.id}')` : `startTest('${test.id}')`}" 
                      ${isCompleted ? 'style="background: linear-gradient(135deg, var(--slate-600), var(--slate-700))"' : ''}
                      ${isCompleted ? 'disabled' : ''}
                      data-tooltip="${isCompleted ? 'Visualizar relatório do teste concluído' : 'Clique para iniciar o teste'}">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${isCompleted ? 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' : 'M13 10V3L4 14h7v7l9-11h-7z'}"/>
                </svg>
                ${isCompleted ? 'Ver Relatório' : 'Iniciar Teste'}
              </button>
            </div>
          `;
        })
        .join('');
    }

    // ============================================
    // INICIAR TESTE
    // ============================================
    function startTest(testId) {
      console.log('🚀 Iniciando teste:', testId);
      
      const urls = { 
        'DISC': 'teste-disc.html', 
        'IE': 'teste-ie.html', 
        'Valores': 'teste-valores.html' 
      };
      
      if (urls[testId]) {
        // Salvar timestamp para evitar cache
        const ts = Date.now();
        window.location.href = `${urls[testId]}?participantId=${currentUser?.id}&ts=${ts}`;
      } else {
        showToast('Teste não encontrado', 'error');
      }
    }

    // ============================================
    // VER RELATÓRIO (para testes concluídos)
    // ============================================
    function viewReport(testId) {
      console.log('📄 Abrindo relatório:', testId);
      
      const reportUrls = {
        'DISC': 'relatorio-disc-vigorre.html',
        'IE': 'relatorio-ie-vigorre.html',
        'Valores': 'relatorio-valores-vigorre.html'
      };
      
      if (reportUrls[testId]) {
        // Salvar dados do participante para o relatório
        localStorage.setItem('vigorre_report_participant', JSON.stringify({
          id: currentUser?.id,
          name: participantData?.name
        }));
        
        const ts = Date.now();
        const newWindow = window.open(`${reportUrls[testId]}?participantId=${currentUser?.id}&ts=${ts}`, '_blank');
        
        if (newWindow) {
          showToast('📊 Abrindo relatório...', 'success');
        } else {
          showToast('⚠️ Bloqueador de pop-up pode estar impedindo', 'warning');
        }
      } else {
        showToast('Relatório não encontrado', 'error');
      }
    }

    // ============================================
    // LOGOUT
    // ============================================
    function logout() {
      console.log('🔐 Realizando logout...');
      
      // Marcar logout para sincronização entre abas
      sessionStorage.setItem('vigorre_logged_out', 'true');
      
      // Limpar dados sensíveis
      localStorage.removeItem('vigorre_current_user');
      localStorage.removeItem('vigorre_password_temp');
      sessionStorage.clear();
      
      // Redirecionar
      window.location.href = 'login.html?loggedout=1&ts=' + Date.now();
    }

    // ============================================
    // TOAST NOTIFICATIONS
    // ============================================
    function showToast(message, type) {
      type = type || 'success';
      
      // Remover toast anterior se existir
      const existing = document.getElementById('toast');
      if (existing) existing.remove();
      
      // Criar novo toast
      const toast = document.createElement('div');
      toast.id = 'toast';
      toast.style.cssText = `
        position: fixed;
        top: 24px;
        right: 24px;
        background: white;
        padding: 14px 24px;
        border-radius: 12px;
        box-shadow: var(--shadow-xl);
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
        color: var(--slate-800);
        z-index: 10001;
        border-left: 4px solid ${type === 'error' ? 'var(--brand-rose)' : type === 'warning' ? 'var(--brand-amber)' : 'var(--brand-emerald)'};
        animation: slideIn 0.3s ease;
        max-width: 400px;
        font-size: 0.875rem;
        border: 1px solid var(--slate-200);
      `;
      
      toast.innerHTML = `
        <span style="font-size: 1.25rem;">${type === 'success' ? '✅' : type === 'error' ? '❌' : '⚠️'}</span>
        <span>${message}</span>
      `;
      
      document.body.appendChild(toast);
      
      // Remover após 4 segundos
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(120%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Adicionar animação do toast
    const style = document.createElement('style');
    style.textContent = `
      @keyframes slideIn {
        from { transform: translateX(120%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
    `;
    document.head.appendChild(style);

    // ============================================
    // PREVENIR BACK BUTTON APÓS LOGOUT
    // ============================================
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        const currentUser = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
        const sessionActive = sessionStorage.getItem('vigorre_session_active') === 'true';
        
        if (!currentUser.role || currentUser.role !== 'participant' || !sessionActive) {
          window.location.replace('login.html');
        }
      }
    });

    // ============================================
    // DEBUG
    // ============================================
    console.log('🔍 Dashboard - Estado:', {
      currentUser: currentUser?.name || 'não carregado',
      supabase: {
        available: typeof window.VigorreDB !== 'undefined',
        connected: VigorreDB?.supabase ? 'conectado' : 'não conectado'
      }
    });
  </script>

</body>
