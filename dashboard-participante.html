<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Área - Vigorre One™</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }
    header { background: linear-gradient(135deg, #1e3a8a, #0f172a); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-img { height: 40px; width: auto; border-radius: 8px; }
    .btn-logout { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-logout:hover { background: rgba(255,255,255,0.3); }
    main { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    .card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 2rem; }
    .card h2 { color: #1e40af; margin-bottom: 1.5rem; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }
    
    /* PERFIL DO PARTICIPANTE */
    .profile-header { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding-bottom: 2rem; border-bottom: 1px solid #e2e8f0; margin-bottom: 2rem; }
    .company-badge {
      width: 60px; height: 60px; background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-transform: uppercase;
    }
    .participant-info { text-align: center; }
    .participant-name { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
    .participant-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; color: #64748b; font-size: 0.9rem; }
    .meta-item { display: flex; align-items: center; gap: 0.5rem; }
    
    /* TESTES */
    .tests-list { display: flex; flex-direction: column; gap: 1rem; }
    .test-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; transition: all 0.3s; position: relative; }
    .test-card:hover { border-color: #3b82f6; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15); }
    .test-card.completed { border-color: #22c55e; background: #f0fdf4; }
    .test-icon { font-size: 2.5rem; margin-bottom: 1rem; }
    .test-title { font-size: 1.2rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
    .test-status { font-size: 0.9rem; color: #64748b; margin-bottom: 1rem; font-weight: 500; }
    .test-status.realizado { color: #166534; font-weight: 700; }
    .test-status.aguardando { color: #f59e0b; font-weight: 600; font-style: italic; }
    
    /* BOTÕES */
    .btn-start { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; background: linear-gradient(135deg, #3b82f6, #1e40af); color: white; }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
    .btn-start:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .empty-state { text-align: center; padding: 3rem; color: #64748b; }
    .empty-state h3 { color: #94a3b8; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="logo-vigorre.png" alt="Vigorre One™" class="logo-img" onerror="this.outerHTML='<div style=\'width:35px;height:35px;background:#fff;color:#1e40af;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;font-size:18px\'>V</div>'">
      <span>Vigorre One™ - Minha Área</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
  </header>

  <main>
    <div class="card">
      <div class="profile-header">
        <!-- Fallback visual com a inicial da empresa (sem erro 404) -->
        <div class="company-badge" id="companyInitial">E</div>
        <div class="participant-info">
          <h2 class="participant-name" id="pName">Carregando...</h2>
          <div class="participant-meta">
            <span class="meta-item">📧 <span id="pEmail">...</span></span>
            <span class="meta-item">📱 <span id="pPhone">...</span></span>
          </div>
          <div class="participant-meta" style="margin-top: 0.5rem;">
            <span class="meta-item">🏢 <span id="pCompany">Independente</span></span>
            <span class="meta-item">💼 <span id="pJob">Não vinculada</span></span>
          </div>
        </div>
      </div>
      
      <h2>📋 Meus Testes</h2>
      <div class="tests-list" id="testsList">
        <!-- Testes serão carregados via JS -->
      </div>
    </div>
  </main>

  <script>
    let currentUser = null;
    let participantData = null;
    let companiesData = [];

    document.addEventListener('DOMContentLoaded', function() {
      loadSession();
      if (!currentUser) { window.location.href = 'login.html'; return; }
      loadParticipantData();
      loadTests();
    });

    function loadSession() {
      try {
        const session = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
        if (session?.id) currentUser = session;
      } catch (e) { console.error('❌ Erro ao carregar sessão:', e); }
    }

    function loadParticipantData() {
      try {
        const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
        participantData = participants.find(p => p.id === currentUser.id);
        
        if (participantData) {
          document.getElementById('pName').textContent = participantData.name || 'Participante';
          document.getElementById('pEmail').textContent = participantData.email || '-';
          document.getElementById('pPhone').textContent = participantData.phone || '-';
          
          companiesData = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
          if (participantData.companyId) {
            const company = companiesData.find(c => c.id === participantData.companyId);
            const companyName = company?.name || 'Independente';
            document.getElementById('pCompany').textContent = companyName;
            
            // Atualiza a inicial do badge com a primeira letra da empresa
            document.getElementById('companyInitial').textContent = companyName.charAt(0).toUpperCase();
          }
          
          if (participantData.jobs && participantData.jobs.length > 0) {
            document.getElementById('pJob').textContent = participantData.jobs[0].name || 'Vaga vinculada';
          } else {
            document.getElementById('pJob').textContent = 'Não vinculada';
          }
        }
      } catch (e) { console.error('❌ Erro ao carregar dados do participante:', e); }
    }

    function loadTests() {
      const testsList = document.getElementById('testsList');
      if (!testsList || !participantData) return;
      
      const availableTests = [
        { id: 'DISC', name: 'Teste DISC', description: 'Análise de perfil comportamental baseada na metodologia DISC', icon: '📊' },
        { id: 'IE', name: 'Inteligência Emocional', description: 'Avaliação de competências emocionais e relacionais', icon: '🧠' },
        { id: 'Valores', name: 'Valores Pessoais', description: 'Mapeamento de valores e motivadores profissionais', icon: '💎' }
      ];
      
      const assignedTests = participantData.tests || participantData.assignedTests || [];
      const completedTests = participantData.completedTests || [];
      
      testsList.innerHTML = '';
      
      if (assignedTests.length === 0) {
        testsList.innerHTML = `<div class="empty-state"><h3>Nenhum teste liberado ainda</h3><p>Entre em contato com o administrador para liberar seus testes comportamentais.</p></div>`;
        return;
      }
      
      availableTests.forEach(function(test) {
        if (assignedTests.includes(test.id)) {
          const isCompleted = completedTests.includes(test.id);
          const statusText = isCompleted ? '✅ Teste Concluído' : '⏳ Disponível para Iniciar';
          const statusClass = isCompleted ? 'realizado' : '';
          
          const testCard = document.createElement('div');
          testCard.className = `test-card ${isCompleted ? 'completed' : ''}`;
          
          // PARTICIPANTE NÃO GERA RELATÓRIO (apenas admin)
          if (isCompleted) {
            testCard.innerHTML = `
              <div class="test-icon">${test.icon}</div>
              <div class="test-title">${test.name}</div>
              <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">${test.description}</p>
              <div class="test-status ${statusClass}">${statusText}</div>
              <div style="background: #fef3c7; color: #92400e; padding: 10px; border-radius: 6px; font-size: 0.85rem; text-align: center; font-weight: 500;">
                📋 Relatório será gerado pelo administrador
              </div>
            `;
          } else {
            testCard.innerHTML = `
              <div class="test-icon">${test.icon}</div>
              <div class="test-title">${test.name}</div>
              <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">${test.description}</p>
              <div class="test-status ${statusClass}">${statusText}</div>
              <button class="btn-start" onclick="startTest('${test.id}')">Iniciar Teste</button>
            `;
          }
          
          testsList.appendChild(testCard);
        }
      });
    }

    function startTest(testId) {
      const testUrls = { 'DISC': 'teste-disc.html', 'IE': 'teste-ie.html', 'Valores': 'teste-valores.html' };
      if (testUrls[testId]) window.location.href = testUrls[testId];
    }

    function logout() {
      localStorage.removeItem('vigorre_current_user');
      sessionStorage.clear();
      window.location.href = 'login.html';
    }

    window.addEventListener('error', function(e) { console.error('❌ Erro no dashboard Vigorre One™:', e); return true; });
  </script>
</body>
</html>
