<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Área - Vigorre One™</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET BÁSICO
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* ============================================
       ESTILO DO CORPO
       ============================================ */
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f8fafc; 
      color: #1e293b; 
      min-height: 100vh; 
    }
    
    /* ============================================
       CABEÇALHO
       ============================================ */
    header { 
      background: linear-gradient(135deg, #1e3a8a, #0f172a); 
      color: white; 
      padding: 15px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700; 
    }
    .logo-img {
      height: 40px;
      width: auto;
      border-radius: 8px;
    }
    .logo-icon { 
      width: 35px; 
      height: 35px; 
      background: white; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #1e3a8a; 
      font-weight: bold; 
    }
    .btn-logout { 
      background: rgba(255,255,255,0.2); 
      border: none; 
      color: white; 
      padding: 8px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
    }
    .btn-logout:hover { 
      background: rgba(255,255,255,0.3); 
    }
    
    /* ============================================
       CONTEÚDO PRINCIPAL
       ============================================ */
    main { 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 40px 20px; 
    }
    
    /* ============================================
       CARDS
       ============================================ */
    .card { 
      background: white; 
      border-radius: 16px; 
      padding: 2rem; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
      margin-bottom: 2rem; 
    }
    .card h2 { 
      color: #1e40af; 
      margin-bottom: 1.5rem; 
      font-size: 1.4rem; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    
    /* ============================================
       PERFIL DO PARTICIPANTE
       ============================================ */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 2rem;
    }
    .company-logo {
      height: 60px;
      width: auto;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .company-logo-fallback {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #1e3a8a, #0f172a);
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .participant-info {
      text-align: center;
    }
    .participant-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }
    .participant-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      color: #64748b;
      font-size: 0.9rem;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    /* ============================================
       TESTES
       ============================================ */
    .tests-list { 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
    }
    .test-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s;
      position: relative;
    }
    .test-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15);
    }
    .test-card.completed {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .test-icon { 
      font-size: 2.5rem; 
      margin-bottom: 1rem; 
    }
    .test-title { 
      font-size: 1.2rem; 
      font-weight: 700; 
      color: #1e293b; 
      margin-bottom: 0.5rem; 
    }
    .test-status { 
      font-size: 0.9rem; 
      color: #64748b; 
      margin-bottom: 1rem; 
      font-weight: 500; 
    }
    .test-status.realizado { 
      color: #166534; 
      font-weight: 700; 
    }
    
    /* ============================================
       BOTÕES
       ============================================ */
    .btn-start { 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: none; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s; 
      background: linear-gradient(135deg, #3b82f6, #1e40af); 
      color: white; 
    }
    .btn-start:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); 
    }
    .btn-start:disabled { 
      background: #cbd5e1; 
      color: #64748b; 
      cursor: not-allowed; 
      transform: none; 
      box-shadow: none; 
    }
    .btn-report {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      background: linear-gradient(135deg, #7C3AED, #1D4ED8);
      color: white;
      margin-top: 0.5rem;
    }
    .btn-report:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }
    .btn-report:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    /* ============================================
       ESTADO VAZIO
       ============================================ */
    .empty-state { 
      text-align: center; 
      padding: 3rem; 
      color: #64748b; 
    }
    .empty-state h3 { 
      color: #94a3b8; 
      margin-bottom: 0.5rem; 
    }
  </style>
</head>
<body>
  <!-- ============================================
       CABEÇALHO COM LOGO E BOTÃO DE SAÍDA - VIGORRE ONE™
       ============================================ -->
  <header>
    <div class="logo">
      <img src="logo-vigorre.png" alt="Vigorre One™" class="logo-img" onerror="this.outerHTML='<div class=\'logo-icon\'>V</div>'">
      <span>Vigorre One™ - Minha Área</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
  </header>

  <!-- ============================================
       CONTEÚDO PRINCIPAL
       ============================================ -->
  <main>
    <!-- Card de Perfil do Participante -->
    <div class="card">
      <div class="profile-header">
        <!-- LOGO DA EMPRESA (SEM FOTO DO PARTICIPANTE) -->
        <img src="logo-empresa.png" alt="Logo da Empresa" class="company-logo" onerror="this.outerHTML='<div class=\'company-logo-fallback\'>E</div>'">
        <div class="participant-info">
          <h2 class="participant-name" id="pName">Carregando...</h2>
          <div class="participant-meta">
            <span class="meta-item">📧 <span id="pEmail">...</span></span>
            <span class="meta-item"> <span id="pPhone">...</span></span>
          </div>
          <div class="participant-meta" style="margin-top: 0.5rem;">
            <span class="meta-item">🏢 <span id="pCompany">Independente</span></span>
            <span class="meta-item">💼 <span id="pJob">Não vinculada</span></span>
          </div>
        </div>
      </div>
      
      <h2>📋 Meus Testes</h2>
      <div class="tests-list" id="testsList">
        <!-- Testes serão carregados via JS -->
      </div>
    </div>
  </main>

  <script>
    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    let currentUser = null;
    let participantData = null;
    let companiesData = [];

    // ============================================
    // INICIALIZAÇÃO - CARREGAR DADOS
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      // Verificar autenticação
      loadSession();
      
      // Se não estiver logado, redirecionar
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }
      
      // Carregar dados do participante e empresa
      loadParticipantData();
      loadTests();
    });

    // ============================================
    // CARREGAR SESSÃO DO USUÁRIO
    // ============================================
    function loadSession() {
      try {
        const session = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
        if (session?.id) {
          currentUser = session;
        }
      } catch (e) {
        console.error('❌ Erro ao carregar sessão:', e);
      }
    }

    // ============================================
    // CARREGAR DADOS DO PARTICIPANTE
    // ============================================
    function loadParticipantData() {
      try {
        const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
        participantData = participants.find(p => p.id === currentUser.id);
        
        if (participantData) {
          // Preencher dados do participante
          document.getElementById('pName').textContent = participantData.name || 'Participante';
          document.getElementById('pEmail').textContent = participantData.email || '-';
          document.getElementById('pPhone').textContent = participantData.phone || '-';
          
          // Carregar dados da empresa
          companiesData = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
          if (participantData.companyId) {
            const company = companiesData.find(c => c.id === participantData.companyId);
            document.getElementById('pCompany').textContent = company?.name || 'Independente';
            
            // Se houver logo da empresa, atualizar
            if (company?.logo) {
              const companyLogo = document.querySelector('.company-logo');
              if (companyLogo) {
                companyLogo.src = company.logo;
              }
            }
          }
          
          // Carregar dados da vaga/cargo
          if (participantData.jobs && participantData.jobs.length > 0) {
            document.getElementById('pJob').textContent = participantData.jobs[0].name || 'Vaga vinculada';
          } else {
            document.getElementById('pJob').textContent = 'Não vinculada';
          }
        }
      } catch (e) {
        console.error('❌ Erro ao carregar dados do participante:', e);
      }
    }

    // ============================================
    // CARREGAR TESTES DO PARTICIPANTE
    // ============================================
    function loadTests() {
      const testsList = document.getElementById('testsList');
      if (!testsList || !participantData) return;
      
      // Lista de testes disponíveis no sistema
      const availableTests = [
        { 
          id: 'DISC', 
          name: 'Teste DISC', 
          description: 'Análise de perfil comportamental baseada na metodologia DISC',
          icon: '📊',
          report: 'relatorio-disc-vigorre.html' 
        },
        { 
          id: 'IE', 
          name: 'Inteligência Emocional', 
          description: 'Avaliação de competências emocionais e relacionais',
          icon: '🧠',
          report: 'relatorio-ie-vigorre.html' 
        },
        { 
          id: 'Valores', 
          name: 'Valores Pessoais', 
          description: 'Mapeamento de valores e motivadores profissionais',
          icon: '💎',
          report: 'relatorio-valores-vigorre.html' 
        }
      ];
      
      // Verificar status de cada teste para este participante
      const assignedTests = participantData.tests || participantData.assignedTests || [];
      const completedTests = participantData.completedTests || [];
      
      // Limpar lista
      testsList.innerHTML = '';
      
      // Verificar se há testes liberados
      if (assignedTests.length === 0) {
        testsList.innerHTML = `
          <div class="empty-state">
            <h3>Nenhum teste liberado ainda</h3>
            <p>Entre em contato com o administrador para liberar seus testes comportamentais.</p>
          </div>
        `;
        return;
      }
      
      // Renderizar cada teste
      availableTests.forEach(function(test) {
        // Verificar se o teste foi liberado para o participante
        if (assignedTests.includes(test.id)) {
          const isCompleted = completedTests.includes(test.id);
          const statusText = isCompleted ? 'Teste Concluído' : 'Disponível para Iniciar';
          const statusClass = isCompleted ? 'realizado' : '';
          
          // Criar card do teste
          const testCard = document.createElement('div');
          testCard.className = `test-card ${isCompleted ? 'completed' : ''}`;
          
          testCard.innerHTML = `
            <div class="test-icon">${test.icon}</div>
            <div class="test-title">${test.name}</div>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">${test.description}</p>
            <div class="test-status ${statusClass}">${statusText}</div>
            ${!isCompleted ? `<button class="btn-start" onclick="startTest('${test.id}')">Iniciar Teste</button>` : ''}
            ${isCompleted ? `<button class="btn-report" onclick="openReport('${test.report}', '${test.id}')">Gerar Relatório</button>` : ''}
          `;
          
          testsList.appendChild(testCard);
        }
      });
    }

    // ============================================
    // INICIAR TESTE
    // ============================================
    function startTest(testId) {
      // Mapear teste para URL
      const testUrls = {
        'DISC': 'teste-disc.html',
        'IE': 'teste-ie.html',
        'Valores': 'teste-valores.html'
      };
      
      const url = testUrls[testId];
      if (url) {
        window.location.href = url;
      }
    }

    // ============================================
    // ABRIR RELATÓRIO
    // ============================================
    function openReport(reportFile, testId) {
      // Abrir relatório em nova aba com ID do participante
      const url = reportFile + '?participantId=' + currentUser.id;
      window.open(url, '_blank');
    }

    // ============================================
    // LOGOUT DO SISTEMA - VIGORRE ONE™
    // ============================================
    function logout() {
      // Remove completamente a sessão do usuário
      localStorage.removeItem('vigorre_current_user');
      
      // Limpa dados temporários de sessão
      sessionStorage.clear();
      
      // Redireciona para a tela de login
      window.location.href = 'login.html';
    }

    // ============================================
    // >>> CORREÇÕES ADICIONADAS (SEM OTIMIZAR) <<<
    // ============================================

    // 1. Tratamento de erro global com fallback amigável
    window.addEventListener('error', function(e) {
      console.error('❌ Erro no dashboard Vigorre One™:', e);
      alert('⚠️ Ocorreu um erro. Recarregue a página se o problema persistir.');
      return true;
    });

    // 2. Debug: Logar estado inicial no console para diagnóstico
    console.log('🔍 Dashboard Vigorre One™ - Estado inicial:', {
      user: currentUser?.name || 'não carregado',
      localStorage: {
        session: !!localStorage.getItem('vigorre_current_user'),
        participants: !!localStorage.getItem('vigorre_participants'),
        companies: !!localStorage.getItem('vigorre_companies'),
        jobs: !!localStorage.getItem('vigorre_jobs')
      }
    });

  </script>
</body>
</html>
