<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vigorre One™ - Plataforma Premium de People Analytics">
  <title>Login | Vigorre One™</title>

  <!-- 🌟 Fonts Premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- 🔗 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    :root {
      --gold: #D4AF37;
      --gold-light: #F4E4BC;
      --navy: #0A192F;
      --blue: #1E3A8A;
      --purple: #7C3AED;
      --white: #FFFFFF;
      --glass: rgba(255, 255, 255, 0.95);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 50%, var(--purple) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--navy);
      overflow-x: hidden;
    }

    /* ==================== CONTAINER PRINCIPAL ==================== */
    .login-container {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== SELO DE SEGURANÇA ==================== */
    .security-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .security-badge::after {
      content: '🔒';
      font-size: 1.2rem;
      color: var(--gold);
    }

    /* ==================== LOGO ==================== */
    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: white;
      padding: 10px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo span {
      font-size: 2.5rem;
      font-weight: 900;
      color: white;
      position: relative;
      z-index: 1;
    }

    .logo-area h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }

    .logo-area p {
      color: var(--blue);
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ==================== SELETOR DE AMBIENTE ==================== */
    .env-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      background: rgba(255, 255, 255, 0.5);
      padding: 8px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .env-btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid transparent;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--navy);
    }

    .env-btn span:first-child {
      font-size: 1.4rem;
    }

    .env-btn:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .env-btn.active {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: white;
      border-color: var(--gold);
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
    }

    /* ==================== FORMULÁRIO ==================== */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.7rem;
      font-weight: 600;
      color: var(--navy);
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid rgba(212, 175, 55, 0.2);
      border-radius: 10px;
      font-size: 1rem;
      transition: var(--transition);
      background: white;
      color: var(--navy);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .form-group input::placeholder {
      color: rgba(10, 25, 47, 0.4);
    }

    /* ==================== BOTÃO DE LOGIN ==================== */
    .btn-login {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--navy), var(--blue), var(--purple));
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login.loading {
      color: transparent;
    }

    .btn-login.loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== ALERTAS ==================== */
    .alert {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: none;
      text-align: center;
      font-weight: 600;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert.error {
      background: rgba(225, 29, 72, 0.1);
      color: #E11D48;
      border: 1px solid rgba(225, 29, 72, 0.2);
    }

    .alert.success {
      background: rgba(5, 150, 105, 0.1);
      color: #059669;
      border: 1px solid rgba(5, 150, 105, 0.2);
    }

    /* ==================== LINKS ==================== */
    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      font-size: 0.9rem;
    }

    .links a {
      color: var(--blue);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }

    .links a:hover {
      color: var(--navy);
      text-decoration: underline;
    }

    /* ==================== RODAPÉ ==================== */
    .login-footer {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      font-size: 0.8rem;
      color: rgba(10, 25, 47, 0.6);
    }

    .login-footer strong {
      color: var(--navy);
      font-weight: 700;
    }

    /* ==================== RESPONSIVIDADE ==================== */
    @media (max-width: 480px) {
      .login-container {
        padding: 2rem 1.5rem;
        margin: 10px;
      }

      .env-selector {
        flex-direction: column;
        gap: 8px;
      }

      .env-btn {
        padding: 12px;
        font-size: 0.85rem;
      }

      .form-group input {
        padding: 14px;
      }

      .links {
        flex-direction: column;
        gap: 12px;
        align-items: center;
      }
    }

    /* Acessibilidade */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
  </style>
</head>
<body>
  <main class="login-container">
    <!-- Selo de Segurança -->
    <div class="security-badge" aria-hidden="true"></div>

    <!-- Logo -->
    <header class="logo-area">
      <div class="logo">
        <img src="logo-vigorre.png" alt="Vigorre One™" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span style="display:none; width:100%; height:100%; background: linear-gradient(135deg, var(--navy), var(--blue), var(--purple)); border-radius: 12px; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 900; color: white;">V</span>
      </div>
      <h1>Vigorre One™</h1>
      <p>People Analytics Enterprise</p>
    </header>

    <!-- Seletor de Ambiente -->
    <fieldset class="env-selector" role="radiogroup" aria-label="Selecione o tipo de acesso">
      <legend class="sr-only">Tipo de acesso</legend>

      <button type="button"
              class="env-btn"
              role="radio"
              aria-checked="false"
              onclick="setEnv('participant')"
              id="env-participant">
        <span>👤</span>
        <span>Participante</span>
      </button>

      <button type="button"
              class="env-btn"
              role="radio"
              aria-checked="false"
              onclick="setEnv('recruiter')"
              id="env-recruiter">
        <span>🎯</span>
        <span>Recrutador</span>
      </button>

      <button type="button"
              class="env-btn active"
              role="radio"
              aria-checked="true"
              onclick="setEnv('admin')"
              id="env-admin">
        <span>🛡️</span>
        <span>Administrador</span>
      </button>
    </fieldset>

    <!-- Alertas -->
    <div id="alert" class="alert" role="alert" aria-live="polite"></div>

    <!-- Formulário -->
    <form id="loginForm" onsubmit="handleLogin(event)" novalidate autocomplete="off">
      <div class="form-group">
        <label for="email">Usuário ou E-mail</label>
        <input type="text"
               id="email"
               name="email"
               required
               placeholder="Digite seu acesso"
               autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password"
               id="password"
               name="password"
               required
               placeholder="••••••••"
               autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Entrar no Vigorre One™
      </button>
    </form>

    <!-- Links -->
    <nav class="links">
      <a href="#" onclick="forgotPassword(event)">Esqueceu a senha?</a>
      <a href="index.html">← Voltar ao site</a>
    </nav>

    <!-- Rodapé -->
    <footer class="login-footer">
      <p>© 2024 <strong>Vigorre One™</strong> - Todos os direitos reservados</p>
      <p>Análise de Pessoas Empresariais • Inteligência Humana</p>
    </footer>
  </main>

  <script>
    'use strict';
    let currentEnv = 'admin';

    // ========== Definir Ambiente ==========
    function setEnv(env) {
      currentEnv = env;
      document.querySelectorAll('.env-btn').forEach(btn => {
        btn.classList.remove('active');
        btn.setAttribute('aria-checked', 'false');
      });
      const activeBtn = document.getElementById('env-' + env);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.setAttribute('aria-checked', 'true');
      }
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      hideAlert();
      document.getElementById('email').focus();
    }

    // ========== Alertas ==========
    function showAlert(msg, type) {
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert ' + type;
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
      setTimeout(hideAlert, type === 'error' ? 6000 : 4000);
    }

    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }

    // ========== Recuperar Senha ==========
    function forgotPassword(e) {
      if (e) e.preventDefault();
      const email = prompt("Recuperar Senha\n\nDigite seu e-mail cadastrado:");
      if (!email?.trim()) return;
      const normalizedEmail = email.trim().toLowerCase();
      const allUsers = [
        ...JSON.parse(localStorage.getItem('vigorre_staff') || '[]'),
        ...JSON.parse(localStorage.getItem('vigorre_participants') || '[]'),
        ...JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]')
      ];
      if (allUsers.some(u => u.email?.toLowerCase() === normalizedEmail)) {
        alert('Um e-mail de recuperação foi enviado para: ' + normalizedEmail);
      } else {
        showAlert('E-mail não encontrado.', 'error');
      }
    }

    // ========== Login Principal ==========
    async function handleLogin(e) {
      e.preventDefault();
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');

      const input = emailInput.value.trim().toLowerCase();
      const pass = passInput.value;

      if (!input || !pass) {
        showAlert('Preencha todos os campos.', 'error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.classList.add('loading');
      loginBtn.textContent = 'Autenticando...';
      hideAlert();

      try {
        // Admin Master
        if (currentEnv === 'admin' && input === 'admin' && pass === 'amovin2026') {
          saveUser({
            id: 'admin-master-001',
            name: 'Administrador Master',
            email: 'admin@vigorre.com.br',
            role: 'admin',
            type: 'admin'
          }, 'admin.html');
          return;
        }

        // ✅ Recruiter - CORREÇÃO: Usar dashboard.html e preservar créditos
        if (currentEnv === 'recruiter') {
          let recruiter = null;
          
          // Tentar Supabase primeiro
          if (window.VigorreDB?.supabase) {
            try {
              const { data } = await VigorreDB.supabase
                .from('recruiters')
                .select('*')
                .eq('email', input)
                .maybeSingle();
              recruiter = data;
            } catch (e) { 
              console.warn('Supabase error:', e); 
            }
          }

          // Fallback localStorage
          if (!recruiter) {
            const recruiters = JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]');
            recruiter = recruiters.find(r => 
              (r.login === input || r.email === input) && r.password === pass
            );
          }

          if (recruiter) {
            // ✅ PRESERVAR CRÉDITOS DO RECRUTADOR
            const userData = {
              id: recruiter.id,
              name: recruiter.name,
              email: recruiter.email,
              role: 'recruiter',
              type: 'recruiter',
              companies: recruiter.companies || [],
              // ✅ Manter estrutura de créditos intacta
              credits: recruiter.credits || { 
                DISC: 50, 
                IE: 20, 
                Valores: 30,
                relatorios: 10,
                laudos: 5
              }
            };
            
            // ✅ CORREÇÃO: Usar dashboard.html conforme estrutura
            saveUser(userData, 'recrutador/dashboard.html');
            return;
          }
        }

        // Participant
        if (currentEnv === 'participant') {
          let participant = null;
          
          if (window.VigorreDB?.supabase) {
            try {
              const { data } = await VigorreDB.supabase
                .from('participants')
                .select('*')
                .eq('email', input)
                .maybeSingle();
              participant = data;
            } catch (e) { console.warn('Supabase error:', e); }
          }

          if (!participant) {
            const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
            participant = participants.find(p => 
              (p.user === input || p.email === input) && p.pass === pass
            );
          }

          if (participant) {
            saveUser({
              id: participant.id,
              name: participant.name,
              email: participant.email,
              role: 'participant',
              type: 'participant'
            }, 'dashboard-participante.html');
            return;
          }
        }

        // Staff (Admin secundário)
        if (currentEnv === 'admin') {
          const staff = JSON.parse(localStorage.getItem('vigorre_staff') || '[]');
          const staffUser = staff.find(s => 
            (s.login === input || s.email === input) && s.password === pass
          );
          if (staffUser) {
            saveUser({
              id: staffUser.id,
              name: staffUser.name,
              email: staffUser.email,
              role: staffUser.role || 'staff',
              type: 'staff'
            }, 'admin.html');
            return;
          }
        }

        showAlert('Credenciais inválidas. Verifique usuário, senha e ambiente.', 'error');

      } catch (error) {
        console.error('Login error:', error);
        showAlert('Erro ao conectar. Verifique sua internet.', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        loginBtn.textContent = 'Entrar no Vigorre One™';
        passInput.focus();
      }
    }

    // ========== Função Auxiliar para Salvar Usuário ==========
    function saveUser(userData, redirectPage) {
      // ✅ CORREÇÃO: Salvar recrutador em chave específica para o dashboard encontrar
      if (userData.role === 'recruiter') {
        localStorage.setItem('vigorre_recruiter', JSON.stringify(userData));
      }
      
      // ✅ Garantir que créditos sejam preservados na sessão
      if (userData.role === 'recruiter' && !userData.credits) {
        userData.credits = { 
          DISC: 50, 
          IE: 20, 
          Valores: 30,
          relatorios: 10,
          laudos: 5
        };
      }
      
      // Manter chave geral para compatibilidade com outros ambientes
      localStorage.setItem('vigorre_current_user', JSON.stringify(userData));
      sessionStorage.setItem('vigorre_session_active', 'true');
      
      showAlert('Bem-vindo, ' + userData.name.split(' ')[0] + '!', 'success');
      
      setTimeout(() => {
        // ✅ Adicionar timestamp para evitar cache do navegador
        window.location.href = redirectPage + '?t=' + Date.now();
      }, 1200);
    }

    // ========== Verificação de Sessão ==========
    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
      const sessionActive = sessionStorage.getItem('vigorre_session_active') === 'true';

      if (currentUser.role && sessionActive) {
        // ✅ Mapeamento correto de páginas por role
        const pages = {
          admin: 'admin.html',
          staff: 'admin.html',
          recruiter: 'recrutador/dashboard.html',
          participant: 'dashboard-participante.html'
        };
        
        const targetPage = pages[currentUser.role] || 'login.html';
        
        // Só redirecionar se não estiver já na página correta
        if (!window.location.href.includes(targetPage)) {
          window.location.href = targetPage + '?t=' + Date.now();
        }
      }
      document.getElementById('email').focus();
    });

    // ========== Prevenir Back Button após logout ==========
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        const currentUser = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
        const sessionActive = sessionStorage.getItem('vigorre_session_active') === 'true';
        
        if (!currentUser.role || !sessionActive) {
          window.location.replace('login.html');
        }
      }
    });

    // ========== Debug para Desenvolvimento (localhost) ==========
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      const recruiters = JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]');
      
      // Criar recrutador de teste se não existir
      if (!recruiters.some(r => r.login === 'recruiter')) {
        recruiters.push({
          id: 'rec_test_001',
          name: 'Recrutador Teste',
          email: 'recruiter@vigorre.com',
          login: 'recruiter',
          password: 'rec123',
          role: 'recruiter',
          companies: [],
          // ✅ Estrutura completa de créditos para teste
          credits: { 
            DISC: 50, 
            IE: 20, 
            Valores: 30,
            relatorios: 10,
            laudos: 5
          }
        });
        localStorage.setItem('vigorre_recruiters', JSON.stringify(recruiters));
        console.log('✅ Recrutador de teste criado: Login: recrutador | Senha: rec123');
        console.log('✅ Créditos iniciais:', recruiters[recruiters.length - 1].credits);
      }
    }

    // ========== Debug inicial para diagnóstico ==========
    console.log('🔍 Login Vigorre One™ - Estado:', {
      env: currentEnv,
      supabase: {
        available: typeof window.VigorreDB !== 'undefined',
        connected: VigorreDB?.supabase ? 'conectado' : 'não conectado'
      },
      localStorage: {
        recruiters: JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]').length,
        participants: JSON.parse(localStorage.getItem('vigorre_participants') || '[]').length
      }
    });
  </script>
</body>
</html>
