<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vigorre One™ - Plataforma de People Analytics e Inteligência Humana">
  <meta name="robots" content="noindex, nofollow">
  <title>Login | Vigorre One™ • People Analytics Enterprise</title>
  
  <!-- Fonts Premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Preconnect para performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- ✅ SUPABASE SDK - CARREGAR PRIMEIRO -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- ✅ SUA CONFIGURAÇÃO SUPABASE -->
  <script src="supabase-config.js"></script>
  
  <!-- ✅ GLOBAL STYLES PREMIUM (DESIGN SYSTEM) -->
  <link rel="stylesheet" href="assets/css/globals.css">
  
  <!-- ✅ ESTILOS ESPECÍFICOS DO LOGIN (CORRIGIDO) -->
  <style>
    /* ============================================
       LOGIN - ESTILOS ESPECÍFICOS
       (Complementa o globals.css) - CORRIGIDO
       ============================================ */
    
    body.login-page { 
      background: linear-gradient(135deg, var(--brand-navy) 0%, var(--brand-blue-dark) 35%, var(--brand-navy-dark) 100%); 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Background Animated Premium */
    body.login-page::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(30, 64, 175, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    
    .login-container { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-2xl); 
      padding: 2.5rem; 
      max-width: 460px; 
      width: 100%; 
      box-shadow: var(--shadow-2xl);
      color: var(--slate-800); 
      position: relative;
      z-index: 10;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    .logo-area { 
      text-align: center; 
      margin-bottom: 2rem; 
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--slate-200);
    }
    
    .logo-placeholder {
      width: 72px;
      height: 72px;
      background: var(--gradient-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      box-shadow: var(--shadow-lg);
    }
    
    .logo-placeholder span {
      font-size: 2rem;
      font-weight: 800;
      color: white;
    }
    
    .logo-area h1 { 
      color: var(--brand-blue-dark); 
      font-size: 1.625rem; 
      font-weight: 800; 
      margin-bottom: 0.25rem;
    }
    
    .logo-area p { 
      color: var(--slate-500); 
      font-size: 0.875rem; 
      font-weight: 500;
      text-transform: uppercase;
    }
    
    /* ✅ SELETOR COM 3 BOTÕES - CORRIGIDO */
    .env-selector { 
      display: flex; /* Mudado de grid para flex */
      gap: 8px; /* Reduzido gap */
      margin-bottom: 2rem; 
      background: var(--slate-50);
      padding: 6px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--slate-200);
    }
    
    .env-btn { 
      flex: 1; /* Espaço igual para cada botão */
      padding: 14px 8px; /* Padding ajustado */
      border: 2px solid transparent;
      border-radius: var(--radius); 
      background: white; /* Fundo branco para contraste */
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.8125rem; 
      transition: all var(--transition); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 6px;
      color: var(--slate-600); /* Cor mais escura */
    }
    
    .env-btn span { 
      font-size: 1.375rem; 
      line-height: 1;
    }
    
    .env-btn.active { 
      border-color: var(--brand-blue); 
      background: linear-gradient(135deg, var(--brand-blue), var(--brand-purple)); 
      color: white; 
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.3);
      font-weight: 700;
    }
    
    .form-group { margin-bottom: 1.25rem; }
    
    .form-group label { 
      display: block; 
      margin-bottom: 0.5rem; 
      color: var(--slate-700); 
      font-weight: 600; 
      font-size: 0.875rem;
    }
    
    .form-group input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 2px solid var(--slate-200); 
      border-radius: var(--radius); 
      font-size: 1rem; 
      transition: all var(--transition); 
      background: white;
    }
    
    .form-group input:focus { 
      outline: none; 
      border-color: var(--brand-blue); 
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }
    
    .btn-login { 
      width: 100%; 
      padding: 16px 24px; 
      border-radius: var(--radius-lg); 
      border: none; 
      background: var(--gradient-primary); 
      color: white; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all var(--transition); 
      margin-top: 0.75rem;
      box-shadow: 0 4px 14px rgba(30, 64, 175, 0.35);
    }
    
    .btn-login:hover { 
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.45);
    }
    
    .btn-login:disabled { 
      opacity: 0.7; 
      cursor: not-allowed; 
      transform: none;
    }
    
    .alert { 
      padding: 14px 16px; 
      border-radius: var(--radius); 
      margin-bottom: 1.25rem; 
      display: none; 
      text-align: center; 
      font-weight: 600; 
      font-size: 0.875rem;
    }
    
    .alert.error { 
      background: #fef2f2; 
      color: var(--brand-rose); 
      border: 1px solid #fecaca;
    }
    
    .alert.success { 
      background: #f0fdf4; 
      color: var(--brand-emerald); 
      border: 1px solid #bbf7d0;
    }
    
    .links { 
      display: flex; 
      justify-content: space-between; 
      margin-top: 1.5rem; 
      font-size: 0.875rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--slate-200);
    }
    
    .links a { 
      color: var(--brand-blue); 
      text-decoration: none; 
      font-weight: 500;
    }
    
    .links a:hover { 
      color: var(--brand-blue-dark);
      text-decoration: underline;
    }
    
    .login-footer {
      text-align: center; 
      margin-top: 2.25rem; 
      color: var(--slate-400); 
      font-size: 0.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--slate-200);
    }
    
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    
    /* Responsivo - CORRIGIDO */
    @media (max-width: 480px) {
      .login-container { padding: 2rem 1.5rem; margin: 10px; }
      .logo-area h1 { font-size: 1.5rem; }
      .env-selector { flex-direction: column; gap: 6px; } /* Empilha no mobile */
      .env-btn { padding: 12px; font-size: 0.875rem; }
      .env-btn span { font-size: 1.25rem; }
      .form-group input { padding: 13px 14px; font-size: 0.9375rem; }
      .btn-login { padding: 15px 20px; font-size: 0.9375rem; }
      .links { flex-direction: column; gap: 10px; align-items: center; }
    }
  </style>
</head>
<body class="login-page">
  
  <main class="login-container" role="main">
    
    <!-- LOGO E TÍTULO -->
    <header class="logo-area">
      <div class="logo-placeholder" aria-hidden="true">
        <span>V</span>
      </div>
      <h1>Vigorre One™</h1>
      <p>People Analytics Enterprise</p>
    </header>

    <!-- ✅ SELETOR DE AMBIENTE COM 3 OPÇÕES -->
    <fieldset class="env-selector" role="radiogroup" aria-label="Selecione seu tipo de acesso">
      <legend class="sr-only">Tipo de acesso</legend>
      
      <button type="button" 
              class="env-btn" 
              role="radio" 
              aria-checked="false"
              onclick="setEnv('participant')"
              id="env-participant">
        <span aria-hidden="true">👤</span> 
        <span>Participante</span>
      </button>
      
      <button type="button" 
              class="env-btn" 
              role="radio" 
              aria-checked="false"
              onclick="setEnv('recruiter')"
              id="env-recruiter">
        <span aria-hidden="true">🎯</span> 
        <span>Recrutador</span>
      </button>
      
      <button type="button" 
              class="env-btn active" 
              role="radio" 
              aria-checked="true"
              onclick="setEnv('admin')"
              id="env-admin">
        <span aria-hidden="true">🛡️</span> 
        <span>Administrador</span>
      </button>
    </fieldset>

    <!-- ÁREA DE ALERTAS -->
    <div id="alert" class="alert" role="alert" aria-live="polite"></div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="loginForm" onsubmit="handleLogin(event)" novalidate autocomplete="off">
      
      <div class="form-group">
        <label for="email">Usuário ou E-mail</label>
        <input type="text" 
               id="email" 
               name="email"
               required 
               placeholder="Digite seu acesso"
               autocomplete="username"
               autocapitalize="none">
      </div>
      
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" 
               id="password" 
               name="password"
               required 
               placeholder="••••••••"
               autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn-login" id="loginBtn">
        Entrar no Vigorre One™
      </button>
    </form>

    <!-- LINKS AUXILIARES -->
    <nav class="links" aria-label="Links de ajuda">
      <a href="#" onclick="forgotPassword(event)">Esqueceu a senha?</a>
      <a href="index.html">← Voltar ao site</a>
    </nav>
    
    <!-- RODAPÉ -->
    <footer class="login-footer">
      <p>© 2024 <strong>Vigorre One™</strong> - Todos os direitos reservados</p>
      <p>People Analytics Enterprise • Inteligência Humana</p>
    </footer>
    
  </main>

  <script>
    'use strict';
    
    let currentEnv = 'admin';
    
    // ============================================
    // FUNÇÃO: Definir ambiente selecionado
    // ============================================
    function setEnv(env) {
      currentEnv = env;
      
      const buttons = document.querySelectorAll('.env-btn');
      buttons.forEach(function(btn) {
        btn.classList.remove('active');
        btn.setAttribute('aria-checked', 'false');
      });
      
      const activeBtn = document.getElementById('env-' + env);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.setAttribute('aria-checked', 'true');
      }
      
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      hideAlert();
      document.getElementById('email').focus();
    }

    // ============================================
    // FUNÇÃO: Exibir alertas
    // ============================================
    function showAlert(msg, type) {
      const alertEl = document.getElementById('alert');
      alertEl.className = 'alert ' + type;
      alertEl.textContent = msg;
      alertEl.style.display = 'block';
      
      setTimeout(function() {
        hideAlert();
      }, type === 'error' ? 6000 : 4000);
    }
    
    function hideAlert() {
      const alertEl = document.getElementById('alert');
      alertEl.style.display = 'none';
    }

    // ============================================
    // FUNÇÃO: Recuperar senha
    // ============================================
    function forgotPassword(e) {
      if (e) e.preventDefault();
      
      const email = prompt("🔐 Recuperar Senha\n\nDigite seu e-mail cadastrado:");
      if (!email || !email.trim()) return;
      
      const normalizedEmail = email.trim().toLowerCase();
      const staff = JSON.parse(localStorage.getItem('vigorre_staff') || '[]');
      const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      const recruiters = JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]');
      
      const allUsers = [].concat(staff, participants, recruiters);
      const found = allUsers.find(function(u) { 
        return u.email && u.email.toLowerCase() === normalizedEmail;
      });
      
      if (found) {
        alert('📧 Recuperação de Senha\n\nUm e-mail foi enviado para: ' + normalizedEmail);
      } else {
        showAlert('❌ E-mail não encontrado.', 'error');
      }
    }

    // ============================================
    // FUNÇÃO PRINCIPAL: Processar login COM SUPABASE
    // ============================================
    async function handleLogin(e) {
      e.preventDefault();
      
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      
      const input = emailInput.value.trim().toLowerCase();
      const pass = passInput.value;
      
      if (!input || !pass) {
        showAlert('⚠️ Preencha todos os campos.', 'error');
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Autenticando...';
      hideAlert();

      try {
        // 1. LOGIN ADMIN MASTER
        if (currentEnv === 'admin' && input === 'admin' && pass === 'amovin2026') {
          const adminUser = {
            id: 'admin-master-001',
            name: 'Administrador Master',
            email: 'admin@vigorre.com.br',
            role: 'admin',
            type: 'admin'
          };
          
          localStorage.setItem('vigorre_current_user', JSON.stringify(adminUser));
          sessionStorage.setItem('vigorre_session_active', 'true');
          
          showAlert('✅ Autenticação realizada!', 'success');
          setTimeout(function() {
            window.location.href = 'admin.html?t=' + Date.now();
          }, 1200);
          return;
        }

        // ✅ 2. LOGIN RECRUTADOR (NOVO!)
        if (currentEnv === 'recruiter') {
          // Primeiro tenta Supabase
          if (window.VigorreDB && VigorreDB.supabase) {
            try {
              const { data: recruiter, error } = await VigorreDB.supabase
                .from('recruiters')
                .select('*')
                .eq('email', input)
                .maybeSingle();
              
              if (recruiter && recruiter.password === pass) {
                const userData = {
                  id: recruiter.id,
                  name: recruiter.name,
                  email: recruiter.email,
                  role: 'recruiter',
                  type: 'recruiter',
                  companies: recruiter.companies || [],
                  credits: recruiter.credits || { DISC: 50, IE: 20, Valores: 30 }
                };
                
                localStorage.setItem('vigorre_current_user', JSON.stringify(userData));
                sessionStorage.setItem('vigorre_session_active', 'true');
                
                showAlert('✅ Bem-vindo, ' + userData.name.split(' ')[0] + '!', 'success');
                setTimeout(function() {
                  window.location.href = 'recrutador/dashboard.html?t=' + Date.now();
                }, 1200);
                return;
              }
            } catch (e) {
              console.warn('⚠️ Erro Supabase recruiter, usando localStorage:', e);
            }
          }
          
          // Fallback localStorage
          const recruiters = JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]');
          const recruiter = recruiters.find(function(r) { 
            return (r.login === input || r.email === input) && r.password === pass;
          });
          
          if (recruiter) {
            const userData = {
              id: recruiter.id,
              name: recruiter.name,
              email: recruiter.email,
              role: 'recruiter',
              type: 'recruiter',
              companies: recruiter.companies || [],
              credits: recruiter.credits || { DISC: 50, IE: 20, Valores: 30 }
            };
            
            localStorage.setItem('vigorre_current_user', JSON.stringify(userData));
            sessionStorage.setItem('vigorre_session_active', 'true');
            
            showAlert('✅ Bem-vindo, ' + userData.name.split(' ')[0] + '!', 'success');
            setTimeout(function() {
              window.location.href = 'recrutador/dashboard.html?t=' + Date.now();
            }, 1200);
            return;
          }
        }

        // 3. LOGIN PARTICIPANTE
        if (currentEnv === 'participant') {
          // Tenta Supabase primeiro
          if (window.VigorreDB && VigorreDB.supabase) {
            try {
              const { data: participant, error } = await VigorreDB.supabase
                .from('participants')
                .select('*')
                .eq('email', input)
                .maybeSingle();
              
              if (participant && participant.password === pass) {
                const userData = {
                  id: participant.id,
                  name: participant.name,
                  email: participant.email,
                  role: participant.role || 'participant',
                  type: 'participant'
                };
                
                localStorage.setItem('vigorre_current_user', JSON.stringify(userData));
                sessionStorage.setItem('vigorre_session_active', 'true');
                
                showAlert('✅ Bem-vindo, ' + userData.name.split(' ')[0] + '!', 'success');
                setTimeout(function() {
                  window.location.href = 'dashboard-participante.html?t=' + Date.now();
                }, 1200);
                return;
              }
            } catch (e) {
              console.warn('⚠️ Erro Supabase participant, usando localStorage:', e);
            }
          }
          
          // Fallback localStorage
          const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
          const participant = participants.find(function(p) { 
            return (p.user === input || p.email === input) && p.pass === pass;
          });
          
          if (participant) {
            const userData = {
              id: participant.id,
              name: participant.name,
              email: participant.email,
              role: 'participant',
              type: 'participant'
            };
            
            localStorage.setItem('vigorre_current_user', JSON.stringify(userData));
            sessionStorage.setItem('vigorre_session_active', 'true');
            
            showAlert('✅ Bem-vindo, ' + participant.name.split(' ')[0] + '!', 'success');
            setTimeout(function() {
              window.location.href = 'dashboard-participante.html?t=' + Date.now();
            }, 1200);
            return;
          }
        }

        // 4. LOGIN STAFF (para admin env)
        if (currentEnv === 'admin') {
          const staff = JSON.parse(localStorage.getItem('vigorre_staff') || '[]');
          const staffUser = staff.find(function(s) { 
            return (s.login === input || s.email === input) && s.password === pass;
          });
          
          if (staffUser) {
            const userData = {
              id: staffUser.id,
              name: staffUser.name,
              email: staffUser.email,
              role: staffUser.role || 'staff',
              type: 'staff'
            };
            
            localStorage.setItem('vigorre_current_user', JSON.stringify(userData));
            sessionStorage.setItem('vigorre_session_active', 'true');
            
            showAlert('✅ Bem-vindo, ' + userData.name.split(' ')[0] + '!', 'success');
            setTimeout(function() {
              window.location.href = 'admin.html?t=' + Date.now();
            }, 1200);
            return;
          }
        }

        // 5. CREDENCIAIS INVÁLIDAS
        showAlert('❌ Credenciais inválidas. Verifique usuário, senha e ambiente selecionado.', 'error');
        
      } catch (error) {
        console.error('❌ Erro no login:', error);
        showAlert('❌ Erro ao conectar. Verifique sua internet.', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Entrar no Vigorre One™';
        passInput.focus();
        passInput.select();
      }
    }

    // ============================================
    // VERIFICAÇÃO DE SESSÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      const currentUser = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
      const sessionActive = sessionStorage.getItem('vigorre_session_active') === 'true';
      
      if (currentUser && currentUser.role && sessionActive) {
        let targetPage = 'login.html';
        
        if (currentUser.role === 'admin' || currentUser.role === 'staff') {
          targetPage = 'admin.html';
        } else if (currentUser.role === 'recruiter') {
          targetPage = 'recrutador/dashboard.html';
        } else if (currentUser.role === 'participant') {
          targetPage = 'dashboard-participante.html';
        }
        
        if (!window.location.href.includes(targetPage)) {
          window.location.href = targetPage + '?t=' + Date.now();
        }
      }
      
      document.getElementById('email').focus();
    });
    
    // ============================================
    // PREVENIR BACK BUTTON APÓS LOGOUT
    // ============================================
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        const currentUser = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
        const sessionActive = sessionStorage.getItem('vigorre_session_active') === 'true';
        
        if (!currentUser.role || !sessionActive) {
          window.location.replace('login.html');
        }
      }
    });
    
    // ============================================
    // DEBUG - CRIAR RECRUTADOR DE TESTE (apenas localhost)
    // ============================================
    if (window.location.hostname === 'localhost') {
      console.log('🔧 Modo desenvolvedor: Criando credenciais de teste...');
      
      // Criar recrutador de teste se não existir
      const recruiters = JSON.parse(localStorage.getItem('vigorre_recruiters') || '[]');
      const exists = recruiters.find(r => r.login === 'recrutador');
      
      if (!exists) {
        const testRecruiter = {
          id: 'rec_test_001',
          name: 'Recrutador Teste',
          email: 'recrutador@vigorre.com',
          login: 'recrutador',
          password: 'rec123',
          role: 'recruiter',
          companies: [],
          credits: { DISC: 50, IE: 20, Valores: 30 }
        };
        recruiters.push(testRecruiter);
        localStorage.setItem('vigorre_recruiters', JSON.stringify(recruiters));
        console.log('✅ Recrutador de teste criado:');
        console.log('   Login: recrutador');
        console.log('   Senha: rec123');
        console.log('   Ambiente: Selecione "Recrutador" no login');
      }
    }
  </script>
</body>
</html>
