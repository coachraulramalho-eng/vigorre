<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Participante - Vigorre One™</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET BÁSICO
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* ============================================
       ESTILO DO CORPO
       ============================================ */
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f8fafc; 
      color: #1e293b; 
      min-height: 100vh; 
    }
    
    /* ============================================
       CABEÇALHO
       ============================================ */
    header { 
      background: linear-gradient(135deg, #1e3a8a, #0f172a); 
      color: white; 
      padding: 15px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700; 
    }
    .logo-img {
      height: 40px;
      width: auto;
      border-radius: 8px;
    }
    .logo-icon { 
      width: 35px; 
      height: 35px; 
      background: white; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #1e3a8a; 
      font-weight: bold; 
    }
    .btn-logout { 
      background: rgba(255,255,255,0.2); 
      border: none; 
      color: white; 
      padding: 8px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
    }
    .btn-logout:hover { 
      background: rgba(255,255,255,0.3); 
    }
    
    /* ============================================
       CONTEÚDO PRINCIPAL
       ============================================ */
    main { 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 40px 20px; 
    }
    
    /* ============================================
       CARDS
       ============================================ */
    .card { 
      background: white; 
      border-radius: 16px; 
      padding: 2rem; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
      margin-bottom: 2rem; 
    }
    .card h2 { 
      color: #1e40af; 
      margin-bottom: 1.5rem; 
      font-size: 1.4rem; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    
    /* ============================================
       FORMULÁRIO
       ============================================ */
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
      gap: 1.5rem; 
    }
    .form-group { 
      display: flex; 
      flex-direction: column; 
    }
    .form-group label { 
      font-size: 0.9rem; 
      color: #475569; 
      margin-bottom: 6px; 
      font-weight: 600; 
    }
    .form-group input,
    .form-group select { 
      padding: 10px 14px; 
      border: 2px solid #e2e8f0; 
      border-radius: 8px; 
      font-size: 1rem; 
      transition: all 0.3s; 
    }
    .form-group input:focus,
    .form-group select:focus { 
      outline: none; 
      border-color: #3b82f6; 
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
    }
    .form-group input:disabled,
    .form-group select:disabled { 
      background: #f1f5f9; 
      cursor: not-allowed; 
    }
    
    /* ============================================
       ESTILO PARA LISTA DE VAGAS SELECIONADAS
       ============================================ */
    .selected-jobs-container {
      margin-top: 10px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
      display: none;
    }
    .selected-jobs-container.active {
      display: block;
    }
    .selected-jobs-title {
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .selected-job-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: white;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #3b82f6;
      font-size: 0.95rem;
    }
    .selected-job-item:last-child {
      margin-bottom: 0;
    }
    .btn-remove-job {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-remove-job:hover {
      background: #dc2626;
    }
    
    /* ============================================
       BOTÕES
       ============================================ */
    .btn-save { 
      background: linear-gradient(135deg, #3b82f6, #1e40af); 
      color: white; 
      padding: 14px 28px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s; 
      margin-top: 1rem; 
    }
    .btn-save:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); 
    }
    .btn-cancel { 
      background: #e2e8f0; 
      color: #475569; 
      padding: 14px 28px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s; 
      margin-top: 1rem; 
      margin-left: 10px; 
    }
    .btn-cancel:hover { 
      background: #cbd5e1; 
    }
    .btn-add-job {
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add-job:hover {
      background: #059669;
    }
    .btn-add-job:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <!-- ============================================
       CABEÇALHO COM LOGO E BOTÃO DE SAÍDA - VIGORRE ONE™
       ============================================ -->
  <header>
    <div class="logo">
      <img src="logo-vigorre.png" alt="Vigorre One™" class="logo-img" onerror="this.outerHTML='<div class=\'logo-icon\'>V</div>'">
      <span>Vigorre One™ - Cadastro de Participante (Admin)</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
  </header>

  <!-- ============================================
       CONTEÚDO PRINCIPAL
       ============================================ -->
  <main>
    <!-- Card de Cadastro -->
    <div class="card">
      <h2>👤 Dados do Participante - Vigorre One™</h2>
      <form id="participantForm">
        <div class="form-grid">
          <!-- Nome Completo -->
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="name">Nome Completo *</label>
            <input type="text" id="name" required placeholder="Digite o nome completo">
          </div>

          <!-- E-mail -->
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="exemplo@email.com">
          </div>

          <!-- Telefone -->
          <div class="form-group">
            <label for="phone">Telefone / WhatsApp</label>
            <input type="tel" id="phone" placeholder="(00) 00000-0000">
          </div>

          <!-- Empresa -->
          <div class="form-group">
            <label for="companyId">Empresa *</label>
            <select id="companyId" required onchange="loadAvailableJobs()">
              <option value="">Selecione a empresa...</option>
            </select>
          </div>

          <!-- Vaga/Cargo - Seleção e Inclusão -->
          <div class="form-group">
            <label for="availableJobSelect">Vaga / Cargo Disponível</label>
            <select id="availableJobSelect">
              <option value="">Selecione a vaga...</option>
            </select>
            <button type="button" class="btn-add-job" id="btnAddJob" onclick="addJobToParticipant()" disabled>
              ➕ Incluir Vaga
            </button>
            
            <!-- Lista de vagas já vinculadas ao participante -->
            <div id="selectedJobsContainer" class="selected-jobs-container">
              <div class="selected-jobs-title">Vagas Vinculadas:</div>
              <div id="selectedJobsList">
                <!-- Vagas serão adicionadas aqui dinamicamente -->
              </div>
            </div>
          </div>

          <!-- Usuário -->
          <div class="form-group">
            <label for="user">Usuário de Acesso *</label>
            <input type="text" id="user" required placeholder="Nome de usuário">
          </div>

          <!-- Senha -->
          <div class="form-group">
            <label for="password">Senha de Acesso *</label>
            <input type="password" id="password" required placeholder="********">
          </div>
        </div>

        <!-- Botões de Ação -->
        <div style="margin-top: 2rem;">
          <button type="submit" class="btn-save">💾 Salvar Participante</button>
          <button type="button" class="btn-cancel" onclick="cancel()">❌ Cancelar</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    const participantId = new URLSearchParams(window.location.search).get('id');
    let companies = [];
    let allJobs = [];
    let selectedJobs = []; // Array para armazenar vagas selecionadas para este participante

    // ============================================
    // VERIFICAÇÃO DE AUTENTICAÇÃO - ADMIN APENAS
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      const currentUser = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
      
      // Se não for admin ou staff, redirecionar para login
      if (!currentUser.role || (currentUser.role !== 'admin' && currentUser.role !== 'staff')) {
        alert('⚠️ Acesso restrito: Apenas administradores podem cadastrar participantes.');
        window.location.href = 'login.html';
        return;
      }
      
      loadCompanies();
      if (participantId) {
        loadParticipantData();
      }
    });

    // ============================================
    // CARREGAR EMPRESAS NO SELECT
    // ============================================
    function loadCompanies() {
      // Busca empresas do localStorage
      companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
      const companySelect = document.getElementById('companyId');
      
      // Limpa opções existentes (mantém a primeira opção padrão)
      companySelect.innerHTML = '<option value="">Selecione a empresa...</option>';
      
      // Adiciona cada empresa como opção no select
      companies.forEach(function(company) {
        const option = document.createElement('option');
        option.value = company.id;
        option.textContent = company.name;
        companySelect.appendChild(option);
      });

      // Se estiver editando um participante existente, seleciona a empresa atual
      if (participantId) {
        const allParticipants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
        const participant = allParticipants.find(function(p) { return p.id === participantId; });
        if (participant && participant.companyId) {
          companySelect.value = participant.companyId;
          // Carrega as vagas disponíveis para esta empresa
          loadAvailableJobs();
          
          // Carrega as vagas já vinculadas a este participante
          if (participant.jobs && Array.isArray(participant.jobs) && participant.jobs.length > 0) {
            selectedJobs = JSON.parse(JSON.stringify(participant.jobs)); // Clone do array
            renderSelectedJobsList();
          }
        }
      }
    }

    // ============================================
    // CARREGAR VAGAS DISPONÍVEIS NO SELECT
    // ============================================
    function loadAvailableJobs() {
      const companyId = document.getElementById('companyId').value;
      const jobSelect = document.getElementById('availableJobSelect');
      const btnAddJob = document.getElementById('btnAddJob');
      
      // Limpa opções de vagas
      jobSelect.innerHTML = '<option value="">Selecione a vaga...</option>';
      
      // Se não houver empresa selecionada, desabilita o select de vagas
      if (!companyId) {
        jobSelect.disabled = true;
        btnAddJob.disabled = true;
        return;
      }
      
      // Busca todas as vagas do localStorage
      allJobs = JSON.parse(localStorage.getItem('vigorre_jobs') || '[]');
      
      // Filtra vagas da empresa selecionada que ainda NÃO foram adicionadas ao participante
      const availableJobs = allJobs.filter(function(job) {
        return job.companyId === companyId && 
               !selectedJobs.find(function(selected) { return selected.id === job.id; });
      });
      
      // Se não houver vagas disponíveis, mostra mensagem e desabilita
      if (availableJobs.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Nenhuma vaga disponível';
        option.disabled = true;
        jobSelect.appendChild(option);
        jobSelect.disabled = true;
        btnAddJob.disabled = true;
        return;
      }
      
      // Adiciona cada vaga disponível como opção no select
      availableJobs.forEach(function(job) {
        const option = document.createElement('option');
        option.value = job.id;
        option.textContent = job.title || job.name || 'Sem título';
        jobSelect.appendChild(option);
      });
      
      // Habilita o select e o botão de adicionar
      jobSelect.disabled = false;
      btnAddJob.disabled = false;
    }

    // ============================================
    // ADICIONAR VAGA AO PARTICIPANTE
    // ============================================
    function addJobToParticipant() {
      const jobSelect = document.getElementById('availableJobSelect');
      const jobId = jobSelect.value;
      
      // Validação: verifica se uma vaga foi selecionada
      if (!jobId) {
        alert('⚠️ Por favor, selecione uma vaga para incluir.');
        return;
      }
      
      // Busca a vaga selecionada no array de todas as vagas
      const job = allJobs.find(function(j) { return j.id === jobId; });
      
      // Verifica se a vaga existe e ainda não foi adicionada
      if (job && !selectedJobs.find(function(sj) { return sj.id === jobId; })) {
        // Adiciona a vaga ao array de selecionadas
        selectedJobs.push({
          id: job.id,
          title: job.title || job.name || 'Sem título',
          companyId: job.companyId,
          description: job.description || ''
        });
        
        // Renderiza a lista atualizada de vagas selecionadas
        renderSelectedJobsList();
        
        // Recarrega as vagas disponíveis (para remover a que foi adicionada)
        loadAvailableJobs();
        
        // Limpa a seleção do dropdown
        jobSelect.value = '';
      }
    }

    // ============================================
    // REMOVER VAGA DO PARTICIPANTE
    // ============================================
    function removeJobFromParticipant(jobId) {
      // Filtra o array para remover a vaga com o ID especificado
      selectedJobs = selectedJobs.filter(function(j) { return j.id !== jobId; });
      
      // Renderiza a lista atualizada
      renderSelectedJobsList();
      
      // Recarrega as vagas disponíveis (para mostrar a que foi removida)
      loadAvailableJobs();
    }

    // ============================================
    // RENDERIZAR LISTA DE VAGAS SELECIONADAS
    // ============================================
    function renderSelectedJobsList() {
      const container = document.getElementById('selectedJobsContainer');
      const list = document.getElementById('selectedJobsList');
      
      // Se não houver vagas selecionadas, esconde o container
      if (selectedJobs.length === 0) {
        container.classList.remove('active');
        return;
      }
      
      // Mostra o container
      container.classList.add('active');
      
      // Limpa a lista atual
      list.innerHTML = '';
      
      // Renderiza cada vaga selecionada
      selectedJobs.forEach(function(job) {
        const jobDiv = document.createElement('div');
        jobDiv.className = 'selected-job-item';
        jobDiv.innerHTML = 
          '<span style="font-weight: 500;">' + (job.title || job.name || 'Sem título') + '</span>' +
          '<button type="button" class="btn-remove-job" onclick="removeJobFromParticipant(\'' + job.id + '\')">' +
            '🗑️ Remover' +
          '</button>';
        list.appendChild(jobDiv);
      });
    }

    // ============================================
    // SALVAR PARTICIPANTE (SUBMIT DO FORMULÁRIO)
    // ============================================
    document.getElementById('participantForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Coleta todos os dados do formulário
      const participantData = {
        id: participantId || Date.now().toString(),
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        companyId: document.getElementById('companyId').value,
        jobs: selectedJobs, // NOVO: Salva array de objetos de vagas
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        tests: participantId ? 
          (JSON.parse(localStorage.getItem('vigorre_participants') || '[]')
            .find(function(p) { return p.id === participantId; })?.tests || []) : [],
        completedTests: participantId ? 
          (JSON.parse(localStorage.getItem('vigorre_participants') || '[]')
            .find(function(p) { return p.id === participantId; })?.completedTests || []) : [],
        createdAt: participantId ? 
          (JSON.parse(localStorage.getItem('vigorre_participants') || '[]')
            .find(function(p) { return p.id === participantId; })?.createdAt) : new Date().toISOString()
      };

      // Busca lista atual de participantes do localStorage
      let participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      
      // Verifica se o participante já existe (edição) ou é novo (cadastro)
      const existingIndex = participants.findIndex(function(p) { return p.id === participantData.id; });
      
      if (existingIndex > -1) {
        // Atualiza participante existente
        participants[existingIndex] = participantData;
        alert('✅ Participante atualizado com sucesso!');
      } else {
        // Adiciona novo participante à lista
        participants.push(participantData);
        alert('✅ Participante cadastrado com sucesso!');
      }
      
      // Salva a lista atualizada no localStorage
      localStorage.setItem('vigorre_participants', JSON.stringify(participants));
      
      // Redireciona para a página do admin
      window.location.href = 'admin.html';
    });

    // ============================================
    // CARREGAR DADOS DO PARTICIPANTE PARA EDIÇÃO
    // ============================================
    function loadParticipantData() {
      if (!participantId) return;
      
      const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      const participant = participants.find(function(p) { return p.id === participantId; });
      
      if (participant) {
        document.getElementById('name').value = participant.name || '';
        document.getElementById('email').value = participant.email || '';
        document.getElementById('phone').value = participant.phone || '';
        document.getElementById('companyId').value = participant.companyId || '';
        document.getElementById('user').value = participant.user || '';
        document.getElementById('password').value = participant.password || '';
        
        // Carrega vagas já vinculadas ao participante
        if (participant.jobs && Array.isArray(participant.jobs) && participant.jobs.length > 0) {
          selectedJobs = JSON.parse(JSON.stringify(participant.jobs)); // Clone para evitar referência
          renderSelectedJobsList();
        }
      }
    }

    // ============================================
    // CANCELAR EDIÇÃO/CADASTRO
    // ============================================
    function cancel() {
      if (confirm('Deseja cancelar? Os dados não serão salvos.')) {
        window.location.href = 'admin.html';
      }
    }

    // ============================================
    // LOGOUT DO SISTEMA - VIGORRE ONE™
    // ============================================
    function logout() {
      // Remove completamente a sessão do usuário
      localStorage.removeItem('vigorre_current_user');
      
      // Limpa dados temporários de sessão
      sessionStorage.clear();
      
      // Redireciona para a tela de login
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
