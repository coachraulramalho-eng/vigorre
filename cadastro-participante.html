<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Participante - Vigorre</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET BÁSICO
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* ============================================
       ESTILO DO CORPO
       ============================================ */
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f8fafc; 
      color: #1e293b; 
      min-height: 100vh; 
    }
    
    /* ============================================
       CABEÇALHO
       ============================================ */
    header { 
      background: linear-gradient(135deg, #1e3a8a, #0f172a); 
      color: white; 
      padding: 15px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700; 
    }
    .logo-img {
      height: 40px;
      width: auto;
      border-radius: 8px;
    }
    .logo-icon { 
      width: 35px; 
      height: 35px; 
      background: white; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #1e3a8a; 
      font-weight: bold; 
    }
    .btn-logout { 
      background: rgba(255,255,255,0.2); 
      border: none; 
      color: white; 
      padding: 8px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
    }
    .btn-logout:hover { 
      background: rgba(255,255,255,0.3); 
    }
    
    /* ============================================
       CONTEÚDO PRINCIPAL
       ============================================ */
    main { 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 40px 20px; 
    }
    
    /* ============================================
       CARDS
       ============================================ */
    .card { 
      background: white; 
      border-radius: 16px; 
      padding: 2rem; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
      margin-bottom: 2rem; 
    }
    .card h2 { 
      color: #1e40af; 
      margin-bottom: 1.5rem; 
      font-size: 1.4rem; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    
    /* ============================================
       FORMULÁRIO
       ============================================ */
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
      gap: 1.5rem; 
    }
    .form-group { 
      display: flex; 
      flex-direction: column; 
    }
    .form-group label { 
      font-size: 0.9rem; 
      color: #475569; 
      margin-bottom: 6px; 
      font-weight: 600; 
    }
    .form-group input,
    .form-group select { 
      padding: 10px 14px; 
      border: 2px solid #e2e8f0; 
      border-radius: 8px; 
      font-size: 1rem; 
      transition: all 0.3s; 
    }
    .form-group input:focus,
    .form-group select:focus { 
      outline: none; 
      border-color: #3b82f6; 
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
    }
    .form-group input:disabled,
    .form-group select:disabled { 
      background: #f1f5f9; 
      cursor: not-allowed; 
    }
    
    /* ============================================
       BOTÕES
       ============================================ */
    .btn-save { 
      background: linear-gradient(135deg, #3b82f6, #1e40af); 
      color: white; 
      padding: 14px 28px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s; 
      margin-top: 1rem; 
    }
    .btn-save:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); 
    }
    .btn-cancel { 
      background: #e2e8f0; 
      color: #475569; 
      padding: 14px 28px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s; 
      margin-top: 1rem; 
      margin-left: 10px; 
    }
    .btn-cancel:hover { 
      background: #cbd5e1; 
    }
  </style>
</head>
<body>
  <!-- ============================================
       CABEÇALHO COM LOGO E BOTÃO DE SAÍDA
       ============================================ -->
  <header>
    <div class="logo">
      <img src="logo-vigorre.png" alt="Vigorre" class="logo-img" onerror="this.outerHTML='<div class=\'logo-icon\'>V</div>'">
      <span>Vigorre - Cadastro de Participante</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
  </header>

  <!-- ============================================
       CONTEÚDO PRINCIPAL
       ============================================ -->
  <main>
    <!-- Card de Cadastro -->
    <div class="card">
      <h2>👤 Dados do Participante</h2>
      <form id="participantForm">
        <div class="form-grid">
          <!-- Nome Completo -->
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="name">Nome Completo *</label>
            <input type="text" id="name" required placeholder="Digite o nome completo">
          </div>

          <!-- E-mail -->
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="exemplo@email.com">
          </div>

          <!-- Telefone -->
          <div class="form-group">
            <label for="phone">Telefone / WhatsApp</label>
            <input type="tel" id="phone" placeholder="(00) 00000-0000">
          </div>

          <!-- Empresa -->
          <div class="form-group">
            <label for="companyId">Empresa *</label>
            <select id="companyId" required onchange="loadJobs()">
              <option value="">Selecione a empresa...</option>
            </select>
          </div>

          <!-- Vaga/Cargo (NOVO CAMPO) -->
          <div class="form-group">
            <label for="jobId">Vaga / Cargo</label>
            <select id="jobId">
              <option value="">Selecione a vaga...</option>
            </select>
          </div>

          <!-- Usuário -->
          <div class="form-group">
            <label for="user">Usuário de Acesso *</label>
            <input type="text" id="user" required placeholder="Nome de usuário">
          </div>

          <!-- Senha -->
          <div class="form-group">
            <label for="password">Senha de Acesso *</label>
            <input type="password" id="password" required placeholder="********">
          </div>
        </div>

        <!-- Botões -->
        <div style="margin-top: 2rem;">
          <button type="submit" class="btn-save">💾 Salvar Participante</button>
          <button type="button" class="btn-cancel" onclick="cancel()">❌ Cancelar</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    const participantId = new URLSearchParams(window.location.search).get('id');
    let companies = [];
    let jobs = [];

    // ============================================
    // CARREGAR EMPRESAS NO SELECT
    // ============================================
    function loadCompanies() {
      companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
      const select = document.getElementById('companyId');
      
      // Limpa opções existentes (mantém a primeira)
      select.innerHTML = '<option value="">Selecione a empresa...</option>';
      
      // Adiciona empresas
      companies.forEach(company => {
        const option = document.createElement('option');
        option.value = company.id;
        option.textContent = company.name;
        select.appendChild(option);
      });

      // Se estiver editando, seleciona a empresa atual
      if (participantId) {
        const allParticipants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
        const participant = allParticipants.find(p => p.id === participantId);
        if (participant && participant.companyId) {
          select.value = participant.companyId;
          loadJobs(); // Carrega vagas da empresa selecionada
        }
      }
    }

    // ============================================
    // CARREGAR VAGAS NO SELECT (NOVA FUNÇÃO)
    // ============================================
    function loadJobs() {
      const companyId = document.getElementById('companyId').value;
      const jobSelect = document.getElementById('jobId');
      
      // Limpa opções de vagas
      jobSelect.innerHTML = '<option value="">Selecione a vaga...</option>';
      
      if (!companyId) {
        jobSelect.disabled = true;
        return;
      }
      
      // Busca vagas do localStorage
      jobs = JSON.parse(localStorage.getItem('vigorre_jobs') || '[]');
      
      // Filtra vagas da empresa selecionada
      const companyJobs = jobs.filter(job => job.companyId === companyId);
      
      if (companyJobs.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Nenhuma vaga cadastrada';
        option.disabled = true;
        jobSelect.appendChild(option);
        jobSelect.disabled = true;
        return;
      }
      
      // Adiciona vagas no select
      companyJobs.forEach(job => {
        const option = document.createElement('option');
        option.value = job.id;
        option.textContent = job.title || job.name;
        jobSelect.appendChild(option);
      });
      
      jobSelect.disabled = false;
      
      // Se estiver editando, seleciona a vaga atual
      if (participantId) {
        const allParticipants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
        const participant = allParticipants.find(p => p.id === participantId);
        if (participant && participant.jobId) {
          jobSelect.value = participant.jobId;
        }
      }
    }

    // ============================================
    // SALVAR PARTICIPANTE
    // ============================================
    document.getElementById('participantForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Coleta dados do formulário
      const participantData = {
        id: participantId || Date.now().toString(),
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        companyId: document.getElementById('companyId').value,
        jobId: document.getElementById('jobId').value || null, // NOVO: Salva o jobId
        user: document.getElementById('user').value,
        password: document.getElementById('password').value,
        tests: participantId ? 
          (JSON.parse(localStorage.getItem('vigorre_participants') || '[]')
            .find(p => p.id === participantId)?.tests || []) : [],
        completedTests: participantId ? 
          (JSON.parse(localStorage.getItem('vigorre_participants') || '[]')
            .find(p => p.id === participantId)?.completedTests || []) : [],
        createdAt: participantId ? 
          (JSON.parse(localStorage.getItem('vigorre_participants') || '[]')
            .find(p => p.id === participantId)?.createdAt) : new Date().toISOString()
      };

      // Busca participantes existentes
      let participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      
      // Verifica se já existe
      const existingIndex = participants.findIndex(p => p.id === participantData.id);
      
      if (existingIndex > -1) {
        // Atualiza participante existente
        participants[existingIndex] = participantData;
        alert('✅ Participante atualizado com sucesso!');
      } else {
        // Adiciona novo participante
        participants.push(participantData);
        alert('✅ Participante cadastrado com sucesso!');
      }
      
      // Salva no localStorage
      localStorage.setItem('vigorre_participants', JSON.stringify(participants));
      
      // Redireciona para lista
      window.location.href = 'admin.html';
    });

    // ============================================
    // CARREGAR DADOS PARA EDIÇÃO
    // ============================================
    function loadParticipantData() {
      if (!participantId) return;
      
      const participants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      const participant = participants.find(p => p.id === participantId);
      
      if (participant) {
        document.getElementById('name').value = participant.name || '';
        document.getElementById('email').value = participant.email || '';
        document.getElementById('phone').value = participant.phone || '';
        document.getElementById('companyId').value = participant.companyId || '';
        document.getElementById('jobId').value = participant.jobId || '';
        document.getElementById('user').value = participant.user || '';
        document.getElementById('password').value = participant.password || '';
      }
    }

    // ============================================
    // CANCELAR
    // ============================================
    function cancel() {
      if (confirm('Deseja cancelar? Os dados não serão salvos.')) {
        window.location.href = 'admin.html';
      }
    }

    // ============================================
    // LOGOUT
    // ============================================
    function logout() {
      localStorage.removeItem('vigorre_current_user');
      window.location.href = 'login.html';
    }

    // ============================================
    // INICIALIZAÇÃO
    // ============================================
    window.addEventListener('DOMContentLoaded', () => {
      loadCompanies();
      if (participantId) {
        loadParticipantData();
      }
    });
  </script>
</body>
</html>
