<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Participante - Vigorre</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); 
      color: white; 
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 600px; margin: 0 auto; }
    .card {
      background: white; border-radius: 20px; padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); color: #1e293b;
    }
    .header { text-align: center; margin-bottom: 2rem; }
    .logo-icon { 
      width: 50px; height: 50px; background: linear-gradient(135deg, #3b82f6, #1e40af); 
      border-radius: 12px; display: flex; align-items: center; justify-content: center; 
      color: white; font-weight: bold; font-size: 24px; margin: 0 auto 1rem;
    }
    .header h1 { color: #1e40af; font-size: 1.5rem; }
    .header p { color: #64748b; font-size: 0.9rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #334155; }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;
      font-size: 1rem; transition: border-color 0.3s;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #3b82f6; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #3b82f6, #1e40af); color: white;
      font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.3s;
      margin-top: 1rem;
    }
    .btn:hover { transform: translateY(-2px); }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .alert.error { background: #fef2f2; color: #dc2626; }
    .alert.success { background: #f0fdf4; color: #16a34a; }
    .back-link { text-align: center; margin-top: 1rem; }
    .back-link a { color: #3b82f6; text-decoration: none; }
    .company-select { background: #f8fafc; padding: 1rem; border-radius: 10px; margin-bottom: 1.5rem; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo-icon">V</div>
        <h1>Cadastro de Participante</h1>
        <p>Preencha seus dados para realizar os testes</p>
      </div>

      <div class="alert" id="alert"></div>

      <div class="company-select" id="companySection" style="display: none;">
        <div class="form-group">
          <label for="companySelect">Selecione sua Empresa</label>
          <select id="companySelect" onchange="loadCompanyData()">
            <option value="">Selecione...</option>
          </select>
        </div>
      </div>

      <form id="participantForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">Nome Completo *</label>
          <input type="text" id="name" required placeholder="Seu nome">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone">WhatsApp *</label>
            <input type="tel" id="phone" required placeholder="(00) 00000-0000">
          </div>
          <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" required placeholder="seu@email.com">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Senha *</label>
          <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha *</label>
          <input type="password" id="confirmPassword" required placeholder="Repita a senha">
        </div>
        <button type="submit" class="btn" id="submitBtn">Cadastrar Participante</button>
      </form>

      <div class="back-link">
        <a href="login.html">← Já tenho conta, fazer login</a>
      </div>
    </div>
  </div>

  <script>
    // Mostrar seleção de empresa se houver empresas cadastradas
    document.addEventListener('DOMContentLoaded', () => {
      const companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
      if (companies.length > 0) {
        document.getElementById('companySection').style.display = 'block';
        const select = document.getElementById('companySelect');
        companies.forEach(company => {
          const option = document.createElement('option');
          option.value = company.id;
          option.textContent = company.name;
          select.appendChild(option);
        });
      }
    });

    // Formatador de telefone
    document.getElementById('phone').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      value = value.replace(/^(\d{2})(\d)/, '($1) $2');
      value = value.replace(/(\d{5})(\d)/, '$1-$2');
      e.target.value = value;
    });

    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
      alert.style.display = 'block';
      setTimeout(() => alert.style.display = 'none', 5000);
    }

    function handleRegister(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('As senhas não conferem', 'error');
        return;
      }

      const participant = {
        id: Date.now(),
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        password: password,
        companyId: document.getElementById('companySelect').value || null,
        type: 'participant',
        createdAt: new Date().toISOString(),
        tests: []
      };

      // Salvar no localStorage
      const users = JSON.parse(localStorage.getItem('vigorre_users') || '[]');
      
      if (users.find(u => u.email === participant.email)) {
        showAlert('Participante já cadastrado com este e-mail', 'error');
        return;
      }

      users.push(participant);
      localStorage.setItem('vigorre_users', JSON.stringify(users));
      
      // Atualizar empresa se selecionada
      if (participant.companyId) {
        const companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
        const companyIndex = companies.findIndex(c => c.id == participant.companyId);
        if (companyIndex !== -1) {
          companies[companyIndex].participants.push(participant.id);
          localStorage.setItem('vigorre_companies', JSON.stringify(companies));
        }
      }
      
      showAlert('Cadastro realizado com sucesso! Redirecionando...', 'success');
      setTimeout(() => window.location.href = 'login.html', 2000);
    }
  </script>
</body>
</html>
