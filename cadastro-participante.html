<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Área - Vigorre</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================
       RESET BÁSICO
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* ============================================
       ESTILO DO CORPO
       ============================================ */
    body { 
      font-family: 'Inter', sans-serif; 
      background: #f8fafc; 
      color: #1e293b; 
      min-height: 100vh; 
    }
    
    /* ============================================
       CABEÇALHO
       ============================================ */
    header { 
      background: linear-gradient(135deg, #1e3a8a, #0f172a); 
      color: white; 
      padding: 15px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      font-weight: 700; 
    }
    .logo-icon { 
      width: 35px; 
      height: 35px; 
      background: white; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #1e3a8a; 
      font-weight: bold; 
    }
    .btn-logout { 
      background: rgba(255,255,255,0.2); 
      border: none; 
      color: white; 
      padding: 8px 16px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 600; 
    }
    .btn-logout:hover { 
      background: rgba(255,255,255,0.3); 
    }
    
    /* ============================================
       CONTEÚDO PRINCIPAL
       ============================================ */
    main { 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 40px 20px; 
    }
    
    /* ============================================
       CARDS
       ============================================ */
    .card { 
      background: white; 
      border-radius: 16px; 
      padding: 2rem; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
      margin-bottom: 2rem; 
    }
    .card h2 { 
      color: #1e40af; 
      margin-bottom: 1rem; 
      font-size: 1.4rem; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    
    /* ============================================
       GRID DE INFORMAÇÕES
       ============================================ */
    .info-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
      gap: 1rem; 
    }
    .info-item { 
      background: #f8fafc; 
      padding: 1rem; 
      border-radius: 10px; 
      border-left: 4px solid #3b82f6; 
    }
    .info-item label { 
      display: block; 
      font-size: 0.85rem; 
      color: #64748b; 
      margin-bottom: 4px; 
      font-weight: 600; 
    }
    .info-item span { 
      font-size: 1rem; 
      color: #1e293b; 
      font-weight: 500; 
    }
    
    /* ============================================
       GRID DE TESTES
       ============================================ */
    .tests-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
      gap: 1.5rem; 
    }
    .test-card { 
      border: 2px solid #e2e8f0; 
      border-radius: 12px; 
      padding: 1.5rem; 
      text-align: center; 
      transition: all 0.3s; 
      position: relative; 
    }
    .test-card:hover { 
      border-color: #3b82f6; 
      transform: translateY(-3px); 
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15); 
    }
    .test-card.completed { 
      border-color: #22c55e; 
      background: #f0fdf4; 
    }
    .test-icon { 
      font-size: 2.5rem; 
      margin-bottom: 1rem; 
    }
    .test-title { 
      font-size: 1.2rem; 
      font-weight: 700; 
      color: #1e293b; 
      margin-bottom: 0.5rem; 
    }
    .test-status { 
      font-size: 0.9rem; 
      color: #64748b; 
      margin-bottom: 1rem; 
      font-weight: 500; 
    }
    .test-status.realizado { 
      color: #166534; 
      font-weight: 700; 
    }
    
    /* ============================================
       BOTÕES
       ============================================ */
    .btn-start { 
      width: 100%; 
      padding: 12px; 
      border-radius: 8px; 
      border: none; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      transition: all 0.3s; 
      background: linear-gradient(135deg, #3b82f6, #1e40af); 
      color: white; 
    }
    .btn-start:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); 
    }
    .btn-start:disabled { 
      background: #cbd5e1; 
      color: #64748b; 
      cursor: not-allowed; 
      transform: none; 
      box-shadow: none; 
    }
    
    /* ============================================
       ESTADO VAZIO
       ============================================ */
    .empty-state { 
      text-align: center; 
      padding: 3rem; 
      color: #64748b; 
    }
    .empty-state h3 { 
      color: #94a3b8; 
      margin-bottom: 0.5rem; 
    }
  </style>
</head>
<body>
  <!-- ============================================
       CABEÇALHO COM LOGO E BOTÃO DE SAÍDA
       ============================================ -->
  <header>
    <div class="logo">
      <div class="logo-icon">V</div>
      <span>Vigorre - Área do Participante</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
  </header>

  <!-- ============================================
       CONTEÚDO PRINCIPAL
       ============================================ -->
  <main>
    <!-- Card de Informações Pessoais -->
    <div class="card">
      <h2>👤 Seus Dados</h2>
      <div class="info-grid" id="personalInfo">
        <!-- Preenchido via JavaScript -->
      </div>
    </div>

    <!-- Card de Testes Liberados -->
    <div class="card">
      <h2>📝 Testes Liberados</h2>
      <div class="tests-grid" id="testsContainer">
        <!-- Preenchido via JavaScript -->
      </div>
    </div>
  </main>

  <script>
    // ============================================
    // VARIÁVEIS GLOBAIS
    // ============================================
    
    // Obtém a sessão do usuário logado do localStorage
    const session = JSON.parse(localStorage.getItem('vigorre_current_user'));
    
    // ============================================
    // VERIFICAÇÃO DE SESSÃO - SEGURANÇA
    // ============================================
    // Se não houver sessão ou ID, redireciona para login
    if (!session || !session.id) {
      window.location.href = 'login.html';
    }

    // ============================================
    // BUSCAR DADOS DO PARTICIPANTE NO LOCALSTORAGE
    // ============================================
    // Obtém a lista completa de participantes
    const allParticipants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
    
    // Encontra o participante com o ID da sessão atual
    const participant = allParticipants.find(p => p.id === session.id);

    // Se não encontrar o participante, exibe erro e faz logout
    if (!participant) {
      alert('Erro ao carregar perfil. Faça login novamente.');
      logout();
    }

    // ============================================
    // FUNÇÃO: RENDERIZAR INFORMAÇÕES PESSOAIS
    // ============================================
    function renderPersonalInfo() {
      const container = document.getElementById('personalInfo');
      
      // Busca a lista de empresas para exibir o nome da empresa vinculada
      const companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
      const company = companies.find(c => c.id === participant.compId);
      
      // Monta o HTML com os dados do participante
      container.innerHTML = `
        <div class="info-item">
          <label>Nome Completo</label>
          <span>${participant.name}</span>
        </div>
        <div class="info-item">
          <label>E-mail</label>
          <span>${participant.email}</span>
        </div>
        <div class="info-item">
          <label>Telefone / WhatsApp</label>
          <span>${participant.phone || 'Não informado'}</span>
        </div>
        <div class="info-item">
          <label>Empresa Vinculada</label>
          <span>${company ? company.name : 'Independente'}</span>
        </div>
        <div class="info-item">
          <label>Usuário de Acesso</label>
          <span>${participant.user}</span>
        </div>
        <div class="info-item">
          <label>Status da Conta</label>
          <span style="color: #22c55e; font-weight: 700;">Ativo</span>
        </div>
      `;
    }

    // ============================================
    // FUNÇÃO: RENDERIZAR TESTES LIBERADOS
    // ============================================
    function renderTests() {
      const container = document.getElementById('testsContainer');
      container.innerHTML = '';

      // Lista completa de testes disponíveis no sistema
      // IDs devem bater EXATAMENTE com os valores salvos no admin.html
      const testsList = [
        { id: 'DISC', name: 'Teste DISC', icon: '📊', url: 'teste-disc.html' },
        { id: 'IE', name: 'Inteligência Emocional', icon: '🧠', url: 'teste-ie.html' },
        { id: 'Valores', name: 'Valores Pessoais', icon: '💎', url: 'teste-valores.html' }
      ];

      // ============================================
      // CORREÇÃO CRÍTICA: Normalizar os arrays de testes
      // O admin.html salva em 'tests', mas também usamos 'assignedTests' como fallback
      // ============================================
      
      // Se o participante não tem o array 'tests', cria vazio
      if (!participant.tests) {
        participant.tests = [];
      }
      
      // Se não tem 'assignedTests', usa 'tests' como fallback
      if (!participant.assignedTests) {
        participant.assignedTests = [...participant.tests];
      }
      
      // Se não tem 'completedTests', cria vazio
      if (!participant.completedTests) {
        participant.completedTests = [];
      }

      // Flag para verificar se há algum teste para exibir
      let hasAnyTest = false;

      // Percorre cada teste disponível no sistema
      testsList.forEach(test => {
        // ============================================
        // VERIFICAÇÃO DE TESTE LIBERADO
        // Verifica em DOIS campos para garantir compatibilidade:
        // 1. 'tests' (campo principal salvo pelo admin)
        // 2. 'assignedTests' (fallback para compatibilidade)
        // ============================================
        const isAssigned = participant.tests.includes(test.id) || 
                          participant.assignedTests.includes(test.id);
        
        // Verifica se o teste já foi concluído pelo participante
        const isCompleted = participant.completedTests.includes(test.id);

        // Só exibe o card se o teste foi liberado para o participante
        if (isAssigned) {
          hasAnyTest = true;
          
          // Cria o elemento do card do teste
          const card = document.createElement('div');
          card.className = `test-card ${isCompleted ? 'completed' : ''}`;
          
          // Define o texto de status conforme o estado do teste
          const statusText = isCompleted ? '✅ Teste Realizado' : '⏳ Disponível para Iniciar';
          const statusClass = isCompleted ? 'realizado' : '';
          
          // Define o texto do botão conforme o estado
          const btnText = isCompleted ? 'Concluído' : 'Iniciar Teste';
          
          // Define se o botão deve estar desabilitado
          const isDisabled = isCompleted ? 'disabled' : '';
          
          // Define a ação de clique apenas se o teste não estiver concluído
          const clickAction = isCompleted ? '' : `onclick="startTest('${test.url}')"`;

          // Monta o HTML interno do card
          card.innerHTML = `
            <div class="test-icon">${test.icon}</div>
            <div class="test-title">${test.name}</div>
            <div class="test-status ${statusClass}">${statusText}</div>
            <button class="btn-start" ${isDisabled} ${clickAction}>${btnText}</button>
          `;
          
          // Adiciona o card ao container
          container.appendChild(card);
        }
      });

      // Se não houver nenhum teste liberado, exibe mensagem de estado vazio
      if (!hasAnyTest) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3>Nenhum teste liberado ainda</h3>
            <p>Entre em contato com o administrador para liberar seus testes comportamentais.</p>
          </div>
        `;
      }
    }

    // ============================================
    // FUNÇÃO: INICIAR TESTE
    // ============================================
    function startTest(url) {
      // Redireciona para a URL do teste selecionado
      window.location.href = url;
    }

    // ============================================
    // FUNÇÃO: FINALIZAR TESTE E MARCAR COMO CONCLUÍDO
    // Esta função deve ser chamada nos arquivos de teste (teste-disc.html, etc.)
    // ao clicar no botão "Finalizar"
    // ============================================
    function finalizarTesteERedirecionar(testId) {
      // Busca a lista atualizada de participantes
      const allParticipants = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      
      // Encontra o índice do participante atual na lista
      const idx = allParticipants.findIndex(p => p.id === session.id);

      // Se encontrar o participante
      if (idx > -1) {
        // Garante que o array de testes concluídos exista
        if (!allParticipants[idx].completedTests) {
          allParticipants[idx].completedTests = [];
        }
        
        // Marca o teste como concluído se ainda não estiver
        // Verifica se o ID já está no array antes de adicionar
        if (!allParticipants[idx].completedTests.includes(testId)) {
          allParticipants[idx].completedTests.push(testId);
        }
        
        // Salva a lista atualizada no localStorage
        localStorage.setItem('vigorre_participants', JSON.stringify(allParticipants));
      }

      // Redireciona de volta para o painel do participante
      window.location.href = 'cadastro-participante.html';
    }

    // ============================================
    // FUNÇÃO: LOGOUT
    // ============================================
    function logout() {
      // Remove a sessão do localStorage
      localStorage.removeItem('vigorre_current_user');
      
      // Redireciona para a página de login
      window.location.href = 'login.html';
    }

    // ============================================
    // INICIALIZAÇÃO DA PÁGINA
    // ============================================
    // Renderiza as informações pessoais ao carregar a página
    renderPersonalInfo();
    
    // Renderiza os testes liberados ao carregar a página
    renderTests();

    // ============================================
    // LISTENER PARA ATUALIZAÇÃO EM TEMPO REAL
    // ============================================
    // Escuta mudanças no localStorage para atualizar os testes automaticamente
    // Isso é útil quando o admin libera um novo teste enquanto o participante está logado
    window.addEventListener('storage', () => {
      // Busca a lista atualizada de participantes
      const updated = JSON.parse(localStorage.getItem('vigorre_participants') || '[]');
      
      // Encontra o participante atual na lista atualizada
      const fresh = updated.find(p => p.id === session.id);
      
      // Se encontrar o participante atualizado
      if (fresh) {
        // Atualiza os arrays de testes com os dados mais recentes
        // Mantém compatibilidade com ambos os campos
        participant.tests = fresh.tests || [];
        participant.assignedTests = fresh.assignedTests || [...participant.tests];
        participant.completedTests = fresh.completedTests || [];
        
        // Re-renderiza os testes para refletir as mudanças
        renderTests();
      }
    });
  </script>
</body>
</html>
