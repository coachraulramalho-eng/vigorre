<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Área | Vigorre One™</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  
  <style>
    :root {
      --brand-navy: #0f172a;
      --brand-purple: #8B5CF6;
      --brand-pink: #EC4899;
      --bg-light: #f8fafc;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --sidebar-width: 260px;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      background-color: var(--bg-light);
      display: flex;
      min-height: 100vh;
      color: #334155;
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, #4c1d95 0%, #2e1065 100%);
      color: white;
      position: fixed;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      z-index: 50;
    }
    
    .logo-box {
      padding: 2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--brand-purple), var(--brand-pink));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.25rem;
    }
    
    .logo-text h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
    .logo-text p { font-size: 0.7rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
    
    .nav-menu { flex: 1; padding: 1.5rem 0; overflow-y: auto; }
    
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px;
      color: rgba(255,255,255,0.7); text-decoration: none; font-weight: 500;
      transition: all 0.2s; cursor: pointer;
      border-left: 3px solid transparent;
    }
    
    .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
    
    .nav-item.active {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), transparent);
      color: white; border-left-color: var(--brand-purple);
    }
    
    .nav-item i { font-size: 1.25rem; }
    
    .user-profile {
      padding: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2);
    }
    .user-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
    .user-info p { font-size: 0.75rem; color: var(--brand-pink); font-weight: 600; }
    
    .logout-btn {
      margin-top: 1rem; width: 100%; padding: 8px;
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.2s;
    }
    .logout-btn:hover { background: rgba(239, 68, 68, 0.2); color: white; }

    /* MAIN CONTENT */
    .main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 2rem;
    }
    
    .welcome-section {
      background: linear-gradient(135deg, var(--brand-purple), var(--brand-pink));
      border-radius: 20px;
      padding: 2.5rem;
      color: white;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
    }
    
    .welcome-section::before {
      content: '';
      position: absolute;
      top: -50%; right: -20%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }
    
    .welcome-section h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; position: relative; }
    .welcome-section p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; position: relative; }
    
    .progress-bar-container {
      margin-top: 1.5rem;
      background: rgba(255,255,255,0.2);
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
      max-width: 300px;
    }
    .progress-fill {
      height: 100%;
      background: white;
      width: 0%;
      border-radius: 10px;
      transition: width 0.5s ease;
    }
    .progress-text { margin-top: 0.5rem; font-size: 0.85rem; font-weight: 600; opacity: 0.9; }

    /* TEST CARDS */
    .section-title {
      font-size: 1.25rem; font-weight: 700; color: var(--brand-navy); margin-bottom: 1.5rem;
    }
    
    .tests-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .test-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--card-shadow);
      border: 1px solid #e2e8f0;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .test-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
    
    .test-card.completed { border-left: 4px solid var(--brand-purple); }
    
    .test-icon {
      width: 56px; height: 56px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
    
    .test-card h3 { font-size: 1.25rem; font-weight: 700; color: var(--brand-navy); margin-bottom: 0.5rem; }
    .test-card p { color: #64748b; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.5rem; }
    
    .btn-test {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600; font-size: 0.9rem;
      text-decoration: none;
      transition: 0.2s;
      border: none; cursor: pointer;
    }
    
    .btn-start { background: linear-gradient(135deg, var(--brand-purple), var(--brand-pink)); color: white; }
    .btn-start:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
    
    .btn-result { background: #f3f4f6; color: var(--brand-navy); }
    .btn-result:hover { background: #e5e7eb; }

    .status-badge {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem; font-weight: 700;
    }
    .badge-done { background: #ecfdf5; color: #059669; }
    .badge-pending { background: #fffbeb; color: #d97706; }

  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-box">
      <div class="logo-icon">V</div>
      <div class="logo-text">
        <h2>Vigorre One™</h2>
        <p>Minha Área</p>
      </div>
    </div>
    
    <nav class="nav-menu">
      <a href="dashboard.html" class="nav-item active"><i class="ph ph-house"></i> Início</a>
      <a href="#" class="nav-item"><i class="ph ph-chart-pie"></i> Meus Resultados</a>
      <a href="#" class="nav-item"><i class="ph ph-user"></i> Meu Perfil</a>
      <a href="#" class="nav-item"><i class="ph ph-book-open"></i> Ajuda</a>
    </nav>
    
    <div class="user-profile">
      <div class="user-info">
        <h4 id="userName">Carregando...</h4>
        <p>Participante</p>
      </div>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Welcome Header -->
    <section class="welcome-section">
      <h1>Olá, <span id="welcomeName">Participante</span>! 👋</h1>
      <p>Continue sua jornada de autoconhecimento e desenvolvimento profissional. Escolha um dos testes abaixo para começar.</p>
      
      <div style="margin-top: 1.5rem;">
        <div class="progress-bar-container">
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0 de 3 testes concluídos</div>
      </div>
    </section>

    <!-- Tests Grid -->
    <h2 class="section-title">Seus Testes Disponíveis</h2>
    <div class="tests-grid" id="testsGrid">
      <!-- Cards serão inseridos via JS -->
    </div>

  </main>

  <script>
    'use strict';
    
    // Configuração dos Testes (Caminhos relativos para a RAIZ ../)
    const testsData = [
      {
        id: 'disc',
        title: 'DISC Comportamental',
        desc: 'Descubra seu perfil comportamental predominante e como você interage com o mundo.',
        icon: '📊',
        color: '#3B82F6',
        link: '../teste-disc.html' // CAMINHO PARA A RAIZ
      },
      {
        id: 'ie',
        title: 'Inteligência Emocional',
        desc: 'Avalie sua capacidade de reconhecer e gerenciar suas emoções e as dos outros.',
        icon: '🧠',
        color: '#8B5CF6',
        link: '../teste-ie.html' // CAMINHO PARA A RAIZ
      },
      {
        id: 'valores',
        title: 'Valores Pessoais',
        desc: 'Entenda quais são seus valores fundamentais e o que motiva suas decisões.',
        icon: '💎',
        color: '#EC4899',
        link: '../teste-valores.html' // CAMINHO PARA A RAIZ
      }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      // Verificação de Sessão
      const user = JSON.parse(localStorage.getItem('vigorre_current_user') || '{}');
      const session = sessionStorage.getItem('vigorre_session_active');
      
      if (!user.id || !session || user.role !== 'participant') {
        window.location.href = 'login.html';
        return;
      }
      
      document.getElementById('userName').textContent = user.name || 'Participante';
      document.getElementById('welcomeName').textContent = user.name?.split(' ')[0] || 'Participante';
      
      // Carregar histórico de testes concluídos
      const history = JSON.parse(localStorage.getItem(`test_history_${user.id}`) || '{}');
      const completedTests = Object.keys(history);
      
      renderTests(completedTests);
      updateProgress(completedTests);
    });
    
    function renderTests(completedTests) {
      const grid = document.getElementById('testsGrid');
      grid.innerHTML = '';
      
      testsData.forEach(test => {
        const isCompleted = completedTests.includes(test.id);
        
        const card = document.createElement('div');
        card.className = `test-card ${isCompleted ? 'completed' : ''}`;
        
        card.innerHTML = `
          <div class="status-badge ${isCompleted ? 'badge-done' : 'badge-pending'}">
            ${isCompleted ? '✅ Concluído' : '⏳ Pendente'}
          </div>
          <div class="test-icon" style="background: ${test.color}20; color: ${test.color}">
            ${test.icon}
          </div>
          <h3>${test.title}</h3>
          <p>${test.desc}</p>
          ${isCompleted 
            ? `<button class="btn-test btn-result" onclick="viewResult('${test.id}')"><i class="ph ph-eye"></i> Ver Resultado</button>`
            : `<button class="btn-test btn-start" onclick="startTest('${test.link}')"><i class="ph ph-play"></i> Iniciar Teste</button>`
          }
        `;
        
        grid.appendChild(card);
      });
    }
    
    function updateProgress(completedTests) {
      const total = testsData.length;
      const done = completedTests.length;
      const pct = (done / total) * 100;
      
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = `${done} de ${total} testes concluídos`;
    }
    
    function startTest(url) {
      // Verificar se já existe sessão de teste para evitar reabertura indevida
      const activeTest = sessionStorage.getItem('active_test');
      if (activeTest) {
        if (!confirm('Você já tem um teste em andamento. Deseja continuar de onde parou?')) {
          return;
        }
      }
      window.location.href = url;
    }
    
    function viewResult(testId) {
      alert(`Redirecionando para o resultado do ${testId.toUpperCase()}`);
      // Futuramente: window.location.href = `resultado-${testId}.html`;
    }
    
    function logout() {
      localStorage.removeItem('vigorre_current_user');
      sessionStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
