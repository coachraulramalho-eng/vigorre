<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Empresa - Vigorre</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); 
      color: white; 
      min-height: 100vh;
    }
    header { 
      padding: 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      max-width: 1200px; 
      margin: 0 auto;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }
    .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
    .logo:hover { opacity: 0.9; }
    .logo-img { height: 70px; width: auto; filter: drop-shadow(0 4px 10px rgba(59, 130, 246, 0.4)); }
    .logo-text h1 { font-size: 1.8rem; font-weight: 700; }
    .logo-text p { font-size: 0.85rem; opacity: 0.9; }
    .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .card {
      background: white; border-radius: 20px; padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); color: #1e293b;
    }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { color: #1e40af; font-size: 1.8rem; margin-bottom: 0.5rem; }
    .header p { color: #64748b; font-size: 1rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #334155; }
    .form-group input {
      width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px;
      font-size: 1rem; transition: border-color 0.3s;
    }
    .form-group input:focus { outline: none; border-color: #3b82f6; }
    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #3b82f6, #1e40af); color: white;
      font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.3s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-secondary {
      background: #e2e8f0; color: #1e293b; margin-top: 1rem;
    }
    .btn-secondary:hover { background: #cbd5e1; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 1rem; display: none; text-align: center; font-weight: 600; }
    .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .back-link { text-align: center; margin-top: 1.5rem; }
    .back-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">
      <img src="logo-vigorre.png" alt="Vigorre" class="logo-img" onerror="this.style.display='none'">
      <div class="logo-text">
        <h1>Vigorre</h1>
        <p>Inteligência e Gestão Estratégica</p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Cadastro de Empresa</h1>
        <p>Preencha os dados da sua organização</p>
      </div>

      <div class="alert" id="alert"></div>

      <form id="companyForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="cnpj">CNPJ *</label>
          <input type="text" id="cnpj" required placeholder="00.000.000/0000-00" maxlength="18">
        </div>
        <div class="form-group">
          <label for="companyName">Nome da Empresa *</label>
          <input type="text" id="companyName" required placeholder="Razão Social">
        </div>
        <div class="form-group">
          <label for="responsible">Responsável *</label>
          <input type="text" id="responsible" required placeholder="Nome completo">
        </div>
        <div class="form-group">
          <label for="phone">WhatsApp *</label>
          <input type="tel" id="phone" required placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label for="email">E-mail Corporativo *</label>
          <input type="email" id="email" required placeholder="contato@empresa.com">
        </div>
        <div class="form-group">
          <label for="password">Senha *</label>
          <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirmar Senha *</label>
          <input type="password" id="confirmPassword" required placeholder="Repita a senha">
        </div>
        <button type="submit" class="btn" id="submitBtn">Cadastrar Empresa</button>
        <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html'">Já tenho cadastro</button>
      </form>

      <div class="back-link">
        <a href="index.html">← Voltar para página inicial</a>
      </div>
    </div>
  </div>

  <script>
    // Formatador de CNPJ
    document.getElementById('cnpj').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      value = value.replace(/^(\d{2})(\d)/, '$1.$2');
      value = value.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
      value = value.replace(/\.(\d{3})(\d)/, '.$1/$2');
      value = value.replace(/(\d{4})(\d)/, '$1-$2');
      e.target.value = value;
    });

    // Formatador de telefone
    document.getElementById('phone').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      value = value.replace(/^(\d{2})(\d)/, '($1) $2');
      value = value.replace(/(\d{5})(\d)/, '$1-$2');
      e.target.value = value;
    });

    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
      alert.style.display = 'block';
      setTimeout(() => alert.style.display = 'none', 5000);
    }

    function handleRegister(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('As senhas não conferem', 'error');
        return;
      }

      const company = {
        id: Date.now(),
        cnpj: document.getElementById('cnpj').value,
        name: document.getElementById('companyName').value,
        responsible: document.getElementById('responsible').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        password: password,
        createdAt: new Date().toISOString(),
        participants: [],
        tests: []
      };

      // Salvar no localStorage
      const companies = JSON.parse(localStorage.getItem('vigorre_companies') || '[]');
      
      if (companies.find(c => c.email === company.email || c.cnpj === company.cnpj)) {
        showAlert('Empresa já cadastrada com este e-mail ou CNPJ', 'error');
        return;
      }

      companies.push(company);
      localStorage.setItem('vigorre_companies', JSON.stringify(companies));
      
      showAlert('Cadastro realizado com sucesso! Redirecionando...', 'success');
      setTimeout(() => window.location.href = 'login.html', 2000);
    }
  </script>
</body>
</html>
